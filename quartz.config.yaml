# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Zhenwei's Blog
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: null
  locale: zh-CN
  baseUrl: blog.zhenwei.site
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: local
    cdnCaching: false
    typography:
      header: Noto Sans SC
      body: Noto Sans SC
      code: JetBrains Mono
    colors:
      lightMode:
        light: "#ffffff"
        lightgray: "#e5e7eb"
        gray: "#667085"
        darkgray: "#374151"
        dark: "#111827"
        secondary: "#2563eb"
        tertiary: "#1d4ed8"
        highlight: rgba(37, 99, 235, 0.10)
        textHighlight: "#fff0ae"
      darkMode:
        light: "#111111"
        lightgray: "#2a2a2a"
        gray: "#a3a3a3"
        darkgray: "#d1d5db"
        dark: "#f1f5f9"
        secondary: "#60a5fa"
        tertiary: "#93c5fd"
        highlight: rgba(96, 165, 250, 0.12)
        textHighlight: "#5d4a0080"
plugins:
  - source: github:quartz-community/created-modified-date
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: github:quartz-community/syntax-highlighting
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40
  - source: github:quartz-community/table-of-contents
    enabled: true
    order: 50
    layout:
      position: right
      priority: 10
  - source: github:quartz-community/crawl-links
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: github:quartz-community/description
    enabled: true
    order: 70
  - source: github:quartz-community/latex
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: github:quartz-community/citations
    enabled: false
    order: 85
  - source: github:quartz-community/hard-line-breaks
    enabled: false
    order: 90
  - source: github:quartz-community/ox-hugo
    enabled: false
    order: 91
  - source: github:quartz-community/roam
    enabled: false
    order: 92
  - source: github:quartz-community/fonts
    enabled: true
    options:
      fontOrigin: local
      useThemeFonts: false
      title: '"PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif'
      header: '"PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif'
      body: '"PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif'
      code: '"SFMono-Regular", "Cascadia Code", "JetBrains Mono", Consolas, monospace'
  - source: github:quartz-community/remove-draft
    enabled: true
  - source: github:quartz-community/explicit-publish
    enabled: false
  - source: github:quartz-community/alias-redirects
    enabled: true
  - source: github:quartz-community/content-index
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: github:quartz-community/favicon
    enabled: true
  - source: github:quartz-community/og-image
    enabled: true
  - source: github:quartz-community/cname
    enabled: true
  - source: github:quartz-community/canvas-page
    enabled: true
  - source: github:quartz-community/content-page
    enabled: true
  - source: github:quartz-community/folder-page
    enabled: true
  - source: github:quartz-community/tag-page
    enabled: true
  - source: github:quartz-community/explorer
    enabled: true
    options:
      folderDefaultState: open
      folderClickBehavior: collapse
      useSavedState: true
    layout:
      position: left
      priority: 50
  - source: ./plugins/graph
    enabled: true
    options:
      localGraph:
        depth: 1
        scale: 0.95
        repelForce: 1.15
        centerForce: 0.2
        linkDistance: 48
        fontSize: 0.72
        opacityScale: 1
        showTags: false
        removeTags: []
        focusOnHover: true
        enableRadial: false
        onlyDirectLinks: true
        maxNodes: 24
      globalGraph:
        depth: -1
        scale: 0.78
        repelForce: 0.8
        centerForce: 0.15
        linkDistance: 40
        fontSize: 0.55
        opacityScale: 1
        showTags: false
        removeTags: []
        focusOnHover: true
        enableRadial: false
        onlyDirectLinks: false
        maxNodes: 0
    layout:
      position: right
      priority: 40
  - source: github:quartz-community/search
    enabled: true
  - source: github:quartz-community/backlinks
    enabled: true
    layout:
      position: right
      priority: 50
  - source: github:quartz-community/article-title
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: github:quartz-community/content-meta
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: github:quartz-community/tag-list
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: github:quartz-community/page-title
    enabled: true
  - source: github:quartz-community/darkmode
    enabled: true
  - source: github:quartz-community/reader-mode
    enabled: true
  - source: github:quartz-community/breadcrumbs
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: github:quartz-community/comments
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: github:quartz-community/footer
    enabled: true
    options:
      links:
        GitHub: https://github.com/ZhenweiCao/zhenweicao.github.io
  - source: github:quartz-community/recent-notes
    enabled: false
  - source: github:quartz-community/spacer
    enabled: false
    options: {}
    order: 25
  - source: github:quartz-community/bases-page
    enabled: true
    options: {}
    order: 50
  - source: github:quartz-community/note-properties
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: false
      collapsed: true
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 30
      display: all
  - source: github:quartz-community/unlisted-pages
    enabled: true
    options: {}
    order: 45
  - source: github:quartz-community/encrypted-pages
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
    order: 900
    layout:
      position: body
      priority: 100
      display: all
  - source: github:quartz-community/stacked-pages
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
layout:
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
