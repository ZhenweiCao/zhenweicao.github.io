<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" role="img" aria-labelledby="title desc">
  <title id="title">NCU Kernel 分析闭环</title>
  <desc id="desc">展示使用 Nsight Systems 和 Nsight Compute 分析 CUDA kernel 的流程：先定位 kernel，再采集基础指标，判断瓶颈，针对性采集 section，修改一个因素并复测。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      text {
        font-family: Arial, Helvetica, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
        fill: #0f172a;
      }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #475569; }
      .label { font-size: 17px; font-weight: 700; }
      .small { font-size: 13px; fill: #475569; }
      .tiny { font-size: 11px; fill: #64748b; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 1.4; rx: 10; }
      .start { fill: #eef6ff; stroke: #2563eb; stroke-width: 1.8; rx: 10; }
      .metric { fill: #ecfdf5; stroke: #059669; stroke-width: 1.8; rx: 10; }
      .decision { fill: #fefce8; stroke: #ca8a04; stroke-width: 1.8; rx: 10; }
      .action { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.8; rx: 10; }
      .arrow { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .loop { stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 6 5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="1240" height="760" fill="#f8fafc"/>
  <text x="50" y="58" class="title">Nsight Compute Kernel 分析闭环</text>
  <text x="50" y="86" class="subtitle">先用 nsys 找目标 kernel，再用 ncu 判断主瓶颈；每轮只改一个因素，复测后再进入下一轮。</text>

  <rect x="80" y="145" width="220" height="88" class="start"/>
  <text x="110" y="178" class="label">1. 端到端计时</text>
  <text x="110" y="207" class="small">业务 trace / nsys timeline</text>

  <rect x="390" y="145" width="220" height="88" class="start"/>
  <text x="420" y="178" class="label">2. 定位 Kernel</text>
  <text x="420" y="207" class="small">找最耗时或最可疑项</text>

  <rect x="700" y="145" width="240" height="88" class="metric"/>
  <text x="730" y="178" class="label">3. 采基础指标</text>
  <text x="730" y="207" class="small">basic / speed-of-light</text>

  <rect x="455" y="300" width="300" height="90" class="decision"/>
  <text x="485" y="334" class="label">4. 判断主瓶颈</text>
  <text x="485" y="363" class="small">compute / memory / occupancy / stall</text>

  <rect x="70" y="465" width="245" height="105" class="box"/>
  <text x="100" y="498" class="label">Compute / Tensor Core</text>
  <text x="100" y="528" class="small">tensor pipe、指令吞吐</text>
  <text x="100" y="551" class="small">tile / dtype / MMA 路径</text>

  <rect x="365" y="465" width="245" height="105" class="box"/>
  <text x="395" y="498" class="label">HBM / L2 / SMEM</text>
  <text x="395" y="528" class="small">带宽、命中率、bank conflict</text>
  <text x="395" y="551" class="small">coalescing、复用、layout</text>

  <rect x="660" y="465" width="245" height="105" class="box"/>
  <text x="690" y="498" class="label">Occupancy / Latency</text>
  <text x="690" y="528" class="small">active warps、register、SMEM</text>
  <text x="690" y="551" class="small">是否隐藏了访存延迟</text>

  <rect x="955" y="465" width="245" height="105" class="box"/>
  <text x="985" y="498" class="label">Branch / Barrier</text>
  <text x="985" y="528" class="small">warp stall、同步、分支</text>
  <text x="985" y="551" class="small">source / SASS 定位</text>

  <rect x="330" y="635" width="240" height="70" class="action"/>
  <text x="360" y="666" class="label">5. 改一个因素</text>
  <text x="360" y="691" class="small">tile / block / layout / dtype</text>

  <rect x="680" y="635" width="240" height="70" class="metric"/>
  <text x="710" y="666" class="label">6. 复测对比</text>
  <text x="710" y="691" class="small">baseline、指标、正确性</text>

  <path d="M 300 189 L 390 189" class="arrow"/>
  <path d="M 610 189 L 700 189" class="arrow"/>
  <path d="M 820 233 C 820 275 605 260 605 300" class="arrow"/>
  <path d="M 605 390 C 605 430 192 425 192 465" class="arrow"/>
  <path d="M 605 390 C 605 430 488 425 488 465" class="arrow"/>
  <path d="M 605 390 C 605 430 782 425 782 465" class="arrow"/>
  <path d="M 605 390 C 605 430 1077 425 1077 465" class="arrow"/>

  <path d="M 192 570 C 192 620 450 610 450 635" class="arrow"/>
  <path d="M 488 570 C 488 610 460 610 460 635" class="arrow"/>
  <path d="M 782 570 C 782 615 540 610 540 635" class="arrow"/>
  <path d="M 1077 570 C 1077 645 570 600 570 660" class="arrow"/>
  <path d="M 570 670 L 680 670" class="arrow"/>
  <path d="M 800 635 C 1020 500 1040 240 940 190" class="loop"/>
  <text x="915" y="330" class="tiny">复测后回到基础指标或更细 section</text>
</svg>
