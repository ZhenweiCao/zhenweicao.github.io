<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 820" role="img" aria-labelledby="title desc">
  <title id="title">GPUDirect RDMA 控制面与数据面流程</title>
  <desc id="desc">展示 GPUDirect RDMA 中 CPU 控制面完成 buffer 注册和连接建立，NIC 数据面直接读写 GPU 显存。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#047857"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .title { font-size: 32px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #475569; }
      .lane-title { font-size: 18px; font-weight: 700; }
      .label { font-size: 16px; font-weight: 700; }
      .body { font-size: 13px; fill: #475569; }
      .small { font-size: 12px; fill: #64748b; }
      .lane-control { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; rx: 8; }
      .lane-data { fill: #ecfdf5; stroke: #059669; stroke-width: 2; rx: 8; }
      .node { fill: #ffffff; stroke: #334155; stroke-width: 1.6; rx: 8; }
      .gpu { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; rx: 8; }
      .nic { fill: #d1fae5; stroke: #059669; stroke-width: 1.6; rx: 8; }
      .net { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.6; rx: 8; }
      .host { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.6; rx: 8; }
      .arrow { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .arrow-green { stroke: #047857; stroke-width: 3; fill: none; marker-end: url(#arrow-green); }
      .arrow-dash { stroke: #334155; stroke-width: 1.8; fill: none; marker-end: url(#arrow); stroke-dasharray: 6 4; }
    </style>
  </defs>
  <rect x="0" y="0" width="1320" height="820" fill="#f8fafc"/>
  <text x="52" y="60" class="title">GPUDirect RDMA：控制面与数据面</text>
  <text x="52" y="90" class="subtitle">“零拷贝”指数据面不经 host staging；CPU 仍负责大部分建连、注册、同步控制</text>

  <rect x="52" y="126" width="1216" height="260" class="lane-control"/>
  <text x="74" y="160" class="lane-title" fill="#1d4ed8">控制面：注册、建连、提交</text>
  <text x="74" y="184" class="small">CPU / runtime / verbs / driver 参与，通常发生在初始化或每次提交传输时</text>

  <rect x="86" y="220" width="145" height="76" class="host"/>
  <text x="158" y="250" text-anchor="middle" class="label">应用进程</text>
  <text x="158" y="272" text-anchor="middle" class="small">NCCL / NIXL</text>

  <path d="M 231 258 L 285 258" class="arrow"/>
  <rect x="285" y="220" width="145" height="76" class="node"/>
  <text x="358" y="250" text-anchor="middle" class="label">CUDA runtime</text>
  <text x="358" y="272" text-anchor="middle" class="small">识别 GPU pointer</text>

  <path d="M 430 258 L 484 258" class="arrow"/>
  <rect x="484" y="220" width="145" height="76" class="node"/>
  <text x="557" y="250" text-anchor="middle" class="label">GDR 注册路径</text>
  <text x="557" y="272" text-anchor="middle" class="small">peermem / dma-buf</text>

  <path d="M 629 258 L 683 258" class="arrow"/>
  <rect x="683" y="220" width="145" height="76" class="node"/>
  <text x="756" y="250" text-anchor="middle" class="label">RDMA verbs</text>
  <text x="756" y="272" text-anchor="middle" class="small">MR / QP / CQ</text>

  <path d="M 828 258 L 882 258" class="arrow"/>
  <rect x="882" y="220" width="145" height="76" class="node"/>
  <text x="955" y="250" text-anchor="middle" class="label">交换连接信息</text>
  <text x="955" y="272" text-anchor="middle" class="small">rkey / addr / GID</text>

  <path d="M 1027 258 L 1081 258" class="arrow"/>
  <rect x="1081" y="220" width="145" height="76" class="node"/>
  <text x="1154" y="250" text-anchor="middle" class="label">提交传输</text>
  <text x="1154" y="272" text-anchor="middle" class="small">post WQE / doorbell</text>

  <rect x="52" y="430" width="1216" height="260" class="lane-data"/>
  <text x="74" y="464" class="lane-title" fill="#047857">数据面：NIC 直接 DMA 读写 GPU memory</text>
  <text x="74" y="488" class="small">传输过程中不需要 GPU -> host pinned buffer -> NIC 的中转拷贝</text>

  <rect x="88" y="536" width="150" height="90" class="gpu"/>
  <text x="163" y="568" text-anchor="middle" class="label">源 GPU HBM</text>
  <text x="163" y="592" text-anchor="middle" class="small">src_gpu_ptr</text>
  <text x="163" y="614" text-anchor="middle" class="small">已注册 MR</text>

  <path d="M 238 581 L 306 581" class="arrow-green"/>
  <rect x="306" y="536" width="150" height="90" class="nic"/>
  <text x="381" y="568" text-anchor="middle" class="label">本机 NIC</text>
  <text x="381" y="592" text-anchor="middle" class="small">PCIe P2P DMA read</text>
  <text x="381" y="614" text-anchor="middle" class="small">不经过 CPU copy</text>

  <path d="M 456 581 L 548 581" class="arrow-green"/>
  <rect x="548" y="536" width="160" height="90" class="net"/>
  <text x="628" y="568" text-anchor="middle" class="label">IB / RoCE 网络</text>
  <text x="628" y="592" text-anchor="middle" class="small">RDMA Write / Read</text>
  <text x="628" y="614" text-anchor="middle" class="small">网络协议由 NIC 处理</text>

  <path d="M 708 581 L 800 581" class="arrow-green"/>
  <rect x="800" y="536" width="150" height="90" class="nic"/>
  <text x="875" y="568" text-anchor="middle" class="label">远端 NIC</text>
  <text x="875" y="592" text-anchor="middle" class="small">PCIe P2P DMA write</text>
  <text x="875" y="614" text-anchor="middle" class="small">写入 GPU BAR 映射</text>

  <path d="M 950 581 L 1018 581" class="arrow-green"/>
  <rect x="1018" y="536" width="150" height="90" class="gpu"/>
  <text x="1093" y="568" text-anchor="middle" class="label">目标 GPU HBM</text>
  <text x="1093" y="592" text-anchor="middle" class="small">dst_gpu_ptr</text>
  <text x="1093" y="614" text-anchor="middle" class="small">等待同步后消费</text>

  <path d="M 1154 296 L 1154 514 L 1093 514 L 1093 536" class="arrow-dash"/>
  <text x="1168" y="410" class="small">完成事件 / CQ</text>

  <rect x="84" y="724" width="530" height="52" class="node"/>
  <text x="104" y="755" class="body">CPU-initiated：CPU post WQE，常见于 NCCL NET / MPI / NIXL verbs 路径。</text>
  <rect x="684" y="724" width="540" height="52" class="node"/>
  <text x="704" y="755" class="body">GPU-initiated：GPU kernel 触发 NIC doorbell，常见于 NVSHMEM IBGDA / DeepEP legacy。</text>
</svg>
