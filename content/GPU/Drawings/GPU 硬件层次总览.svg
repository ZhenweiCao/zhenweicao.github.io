<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">GPU 硬件层次总览</title>
  <desc id="desc">展示 CPU 发起 kernel launch 后，GPU 内部从 HBM、L2、GPC 到 SM、CTA、warp 和 thread 的层次关系。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      text {
        font-family: Arial, Helvetica, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
        fill: #0f172a;
      }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #475569; }
      .label { font-size: 17px; font-weight: 700; }
      .small { font-size: 13px; fill: #475569; }
      .tiny { font-size: 11px; fill: #64748b; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 1.5; rx: 8; }
      .soft { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.2; rx: 8; }
      .gpu { fill: #eef6ff; stroke: #2563eb; stroke-width: 2; rx: 14; }
      .mem { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.8; rx: 8; }
      .cache { fill: #ecfdf5; stroke: #059669; stroke-width: 1.8; rx: 8; }
      .gpc { fill: #f8fafc; stroke: #64748b; stroke-width: 1.4; rx: 10; }
      .sm { fill: #fefce8; stroke: #ca8a04; stroke-width: 1.4; rx: 8; }
      .unit { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; rx: 5; }
      .arrow { stroke: #334155; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 1.4; stroke-dasharray: 5 5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="760" fill="#f8fafc"/>
  <text x="50" y="58" class="title">GPU 硬件层次总览</text>
  <text x="50" y="86" class="subtitle">这是概念图，不表示真实芯片 floorplan；重点是看清“任务如何下发、数据如何流动、CTA/Warp 在哪里执行”。</text>

  <rect x="50" y="125" width="190" height="120" class="box"/>
  <text x="80" y="160" class="label">CPU / Host</text>
  <text x="80" y="188" class="small">Python / C++</text>
  <text x="80" y="211" class="small">CUDA Runtime</text>
  <text x="80" y="234" class="small">Driver API</text>

  <rect x="285" y="125" width="185" height="120" class="soft"/>
  <text x="315" y="160" class="label">Kernel Launch</text>
  <text x="315" y="188" class="small">gridDim / blockDim</text>
  <text x="315" y="211" class="small">stream / events</text>
  <text x="315" y="234" class="small">参数与指针</text>
  <path d="M 240 185 L 285 185" class="arrow"/>

  <rect x="520" y="110" width="620" height="590" class="gpu"/>
  <text x="550" y="145" class="label">GPU Package</text>
  <text x="670" y="145" class="small">多个 GPC / SM 共同执行一个 grid</text>
  <path d="M 470 185 L 520 185" class="arrow"/>

  <rect x="560" y="175" width="540" height="68" class="mem"/>
  <text x="585" y="205" class="label">HBM / Global Memory</text>
  <text x="585" y="228" class="small">模型权重、激活、KV cache、输入输出张量</text>

  <rect x="560" y="275" width="540" height="58" class="cache"/>
  <text x="585" y="308" class="label">L2 Cache</text>
  <text x="700" y="308" class="small">跨 SM 共享，缓存 global/local memory 访问</text>
  <path d="M 830 243 L 830 275" class="arrow"/>

  <g>
    <rect x="560" y="365" width="250" height="245" class="gpc"/>
    <text x="580" y="393" class="label">GPC / SM group</text>
    <rect x="580" y="415" width="95" height="155" class="sm"/>
    <text x="603" y="440" class="label">SM</text>
    <rect x="594" y="454" width="67" height="18" class="unit"/>
    <text x="601" y="467" class="tiny">Warp sched</text>
    <rect x="594" y="478" width="67" height="18" class="unit"/>
    <text x="604" y="491" class="tiny">Registers</text>
    <rect x="594" y="502" width="67" height="18" class="unit"/>
    <text x="602" y="515" class="tiny">L1 / SMEM</text>
    <rect x="594" y="526" width="67" height="18" class="unit"/>
    <text x="603" y="539" class="tiny">Tensor Core</text>
    <text x="594" y="560" class="tiny">CTA / warps</text>

    <rect x="695" y="415" width="95" height="155" class="sm"/>
    <text x="718" y="440" class="label">SM</text>
    <rect x="709" y="454" width="67" height="18" class="unit"/>
    <text x="716" y="467" class="tiny">Warp sched</text>
    <rect x="709" y="478" width="67" height="18" class="unit"/>
    <text x="719" y="491" class="tiny">Registers</text>
    <rect x="709" y="502" width="67" height="18" class="unit"/>
    <text x="717" y="515" class="tiny">L1 / SMEM</text>
    <rect x="709" y="526" width="67" height="18" class="unit"/>
    <text x="718" y="539" class="tiny">CUDA Core</text>
    <text x="709" y="560" class="tiny">CTA / warps</text>
  </g>

  <g>
    <rect x="850" y="365" width="250" height="245" class="gpc"/>
    <text x="870" y="393" class="label">GPC / SM group</text>
    <rect x="870" y="415" width="95" height="155" class="sm"/>
    <text x="893" y="440" class="label">SM</text>
    <rect x="884" y="454" width="67" height="18" class="unit"/>
    <text x="891" y="467" class="tiny">Warp sched</text>
    <rect x="884" y="478" width="67" height="18" class="unit"/>
    <text x="894" y="491" class="tiny">Registers</text>
    <rect x="884" y="502" width="67" height="18" class="unit"/>
    <text x="892" y="515" class="tiny">L1 / SMEM</text>
    <rect x="884" y="526" width="67" height="18" class="unit"/>
    <text x="893" y="539" class="tiny">Tensor Core</text>
    <text x="884" y="560" class="tiny">CTA / warps</text>

    <rect x="985" y="415" width="95" height="155" class="sm"/>
    <text x="1008" y="440" class="label">SM</text>
    <rect x="999" y="454" width="67" height="18" class="unit"/>
    <text x="1006" y="467" class="tiny">Warp sched</text>
    <rect x="999" y="478" width="67" height="18" class="unit"/>
    <text x="1009" y="491" class="tiny">Registers</text>
    <rect x="999" y="502" width="67" height="18" class="unit"/>
    <text x="1007" y="515" class="tiny">L1 / SMEM</text>
    <rect x="999" y="526" width="67" height="18" class="unit"/>
    <text x="1008" y="539" class="tiny">CUDA Core</text>
    <text x="999" y="560" class="tiny">CTA / warps</text>
  </g>

  <path d="M 830 333 L 830 360" class="arrow"/>
  <path d="M 720 333 C 720 350 630 350 630 415" class="dash"/>
  <path d="M 940 333 C 940 350 1030 350 1030 415" class="dash"/>

  <rect x="75" y="330" width="360" height="245" class="box"/>
  <text x="105" y="365" class="label">CUDA 层次到硬件的映射</text>
  <text x="105" y="404" class="small">Grid：一次 kernel launch 的全部工作</text>
  <text x="105" y="432" class="small">Block / CTA：被调度到一个 SM 上</text>
  <text x="105" y="460" class="small">Warp：32 个 thread，硬件调度单位</text>
  <text x="105" y="488" class="small">Thread：持有自己的寄存器和程序路径</text>
  <text x="105" y="528" class="small">L2 / HBM：所有 SM 共享的数据后端</text>
  <text x="105" y="552" class="small">SMEM / Register：每个 SM 内部的片上资源</text>

  <rect x="560" y="635" width="540" height="40" class="soft"/>
  <text x="585" y="660" class="small">读图口诀：CPU 发起 kernel；grid 被切成 CTA；CTA 驻留在 SM；warp 在 SM 内发指令；数据经 L2/HBM 流动。</text>
</svg>
