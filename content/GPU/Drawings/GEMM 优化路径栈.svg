<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 880" role="img" aria-labelledby="title desc">
  <title id="title">CUDA GEMM 优化路径栈</title>
  <desc id="desc">纵向金字塔展示 CUDA GEMM 从 Naive global memory、SMEM tiling、cp.async 双缓冲、Tensor Core（WMMA/mma.sync）、Hopper TMA+wgmma+warp specialization 到 Blackwell tcgen05.mma+TMEM+block-scaled FP4 的六层演进，配合 A100/H100/B200 dense 量级性能参照。</desc>
  <defs>
    <style>
      text {
        font-family: Arial, Helvetica, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
        fill: #0f172a;
      }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #475569; }
      .label { font-size: 18px; font-weight: 700; }
      .small { font-size: 13px; fill: #475569; }
      .tiny { font-size: 11px; fill: #64748b; }
      .perf { font-size: 13px; font-weight: 700; fill: #0f172a; }
      .ruler { font-size: 11px; fill: #64748b; }
      .l1 { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.8; }
      .l2 { fill: #eef6ff; stroke: #2563eb; stroke-width: 1.8; }
      .l25 { fill: #e0f2fe; stroke: #0284c7; stroke-width: 1.8; }
      .l3 { fill: #ecfdf5; stroke: #059669; stroke-width: 1.8; }
      .l4 { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.8; }
      .l5 { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.8; }
      .callout { fill: #fefce8; stroke: #ca8a04; stroke-width: 1.6; rx: 8; }
      .axis { stroke: #94a3b8; stroke-width: 1.2; fill: none; }
      .tick { stroke: #94a3b8; stroke-width: 1; }
    </style>
  </defs>

  <rect x="0" y="0" width="1240" height="880" fill="#f8fafc"/>

  <text x="50" y="50" class="title">CUDA GEMM 优化路径栈</text>
  <text x="50" y="78" class="subtitle">从 Naive 到 Blackwell tcgen05 的演进；数字仅为示意量级，规格表为 dense / sparse 唯一来源（见 Hardware/NVIDIA GPU 架构与规格）。</text>

  <!-- 金字塔（中心 x=620） -->
  <!-- L1 底层（Naive） y=640..732，宽 1000 → 872 -->
  <polygon class="l1" points="120,732 1120,732 1056,640 184,640"/>
  <text x="620" y="668" text-anchor="middle" class="label">L1 · Naive global memory</text>
  <text x="620" y="690" text-anchor="middle" class="small">每线程 1 个 C 元素 · 全部走 HBM · 无 SMEM 复用</text>
  <text x="620" y="710" text-anchor="middle" class="small">访存受限，算术强度 ≪ HBM 带宽 / FLOPS 比</text>
  <text x="620" y="727" text-anchor="middle" class="perf">~500 GFLOPS（A100 FP32 参照量级）</text>

  <!-- L2 SMEM tiling y=540..632，宽 872 → 744 -->
  <polygon class="l2" points="184,632 1056,632 992,540 248,540"/>
  <text x="620" y="568" text-anchor="middle" class="label">L2 · SMEM tiling（block tile + 线程 register tile）</text>
  <text x="620" y="590" text-anchor="middle" class="small">A/B 子块加载到 shared memory，K 维循环复用 K 次</text>
  <text x="620" y="610" text-anchor="middle" class="small">合并访存 + 避免 bank conflict + register blocking</text>
  <text x="620" y="627" text-anchor="middle" class="perf">≈ Naive × 10 量级（典型 ~5 TFLOPS FP32）</text>

  <!-- L2.5 双缓冲 / cp.async y=440..532，宽 744 → 616 -->
  <polygon class="l25" points="248,532 992,532 928,440 312,440"/>
  <text x="620" y="468" text-anchor="middle" class="label">L2.5 · 双缓冲 / cp.async 流水线（Ampere SM80+）</text>
  <text x="620" y="490" text-anchor="middle" class="small">cp.async 直 HBM → SMEM 绕过寄存器，overlap load 与 MMA</text>
  <text x="620" y="510" text-anchor="middle" class="small">multi-stage pipeline（2~4 stage），隐藏访存延迟</text>
  <text x="620" y="527" text-anchor="middle" class="perf">≈ 单缓冲 × 2 量级（依赖访存/计算比）</text>

  <!-- L3 Tensor Core (WMMA / mma.sync) y=340..432，宽 616 → 488 -->
  <polygon class="l3" points="312,432 928,432 864,340 376,340"/>
  <text x="620" y="368" text-anchor="middle" class="label">L3 · Tensor Core（WMMA / mma.sync，Volta/Ampere）</text>
  <text x="620" y="390" text-anchor="middle" class="small">硬件矩阵指令 m16n8k16 等；FP16/BF16/TF32</text>
  <text x="620" y="410" text-anchor="middle" class="small">ldmatrix + stmatrix，SMEM swizzle 满足 fragment 排布</text>
  <text x="620" y="427" text-anchor="middle" class="perf">~80 TFLOPS（A100 FP16 dense）</text>

  <!-- L4 TMA + wgmma + warp specialization y=240..332，宽 488 → 360 -->
  <polygon class="l4" points="376,332 864,332 800,240 440,240"/>
  <text x="620" y="268" text-anchor="middle" class="label">L4 · TMA + wgmma + warp specialization（Hopper）</text>
  <text x="620" y="290" text-anchor="middle" class="small">TMA 异步 bulk copy（含 multicast / mbarrier）</text>
  <text x="620" y="310" text-anchor="middle" class="small">wgmma 以 warpgroup 为单位 + producer/consumer 模型</text>
  <text x="620" y="327" text-anchor="middle" class="perf">~700 TFLOPS（H100 FP16 dense 量级）</text>

  <!-- L5 顶层 tcgen05 + TMEM + FP4 y=140..232，宽 360 → 232 -->
  <polygon class="l5" points="440,232 800,232 736,140 504,140"/>
  <text x="620" y="168" text-anchor="middle" class="label">L5 · tcgen05.mma + TMEM + FP4（Blackwell）</text>
  <text x="620" y="188" text-anchor="middle" class="small">第五代 TC · 256 KB TMEM/SM 累加</text>
  <text x="620" y="206" text-anchor="middle" class="small">MXFP4 / NVFP4 + E8M0 block scale</text>
  <text x="620" y="223" text-anchor="middle" class="perf">~4.5 PFLOPS（B200 FP4 dense 量级）</text>

  <!-- 右侧性能纵向标尺（log 量级） -->
  <line class="axis" x1="1170" y1="150" x2="1170" y2="725"/>
  <text x="1185" y="120" class="ruler" transform="rotate(0 1185 120)">性能（log 量级）</text>
  <text x="1185" y="138" class="ruler">↑ 高</text>

  <line class="tick" x1="1165" y1="180" x2="1175" y2="180"/>
  <text x="1180" y="184" class="ruler">PFLOPS</text>

  <line class="tick" x1="1165" y1="285" x2="1175" y2="285"/>
  <text x="1180" y="289" class="ruler">100 TFLOPS</text>

  <line class="tick" x1="1165" y1="385" x2="1175" y2="385"/>
  <text x="1180" y="389" class="ruler">10 TFLOPS</text>

  <line class="tick" x1="1165" y1="485" x2="1175" y2="485"/>
  <text x="1180" y="489" class="ruler">TFLOPS</text>

  <line class="tick" x1="1165" y1="585" x2="1175" y2="585"/>
  <text x="1180" y="589" class="ruler">100 GFLOPS</text>

  <line class="tick" x1="1165" y1="690" x2="1175" y2="690"/>
  <text x="1180" y="694" class="ruler">10 GFLOPS</text>

  <text x="1185" y="720" class="ruler">↓ 低</text>

  <!-- 左侧硬件代际标注 -->
  <text x="60" y="186" class="tiny">Blackwell B200</text>
  <text x="60" y="286" class="tiny">Hopper H100</text>
  <text x="60" y="386" class="tiny">Volta / Ampere</text>
  <text x="60" y="486" class="tiny">Ampere SM80+</text>
  <text x="60" y="586" class="tiny">所有代际</text>
  <text x="60" y="686" class="tiny">所有代际</text>

  <!-- 底部 callout -->
  <rect x="120" y="790" width="1000" height="60" class="callout"/>
  <text x="140" y="815" class="label">⚠ 口径警告</text>
  <text x="140" y="838" class="small">不同代际峰值口径不同（dense vs sparse · FP32 / FP16 / BF16 / FP8 / FP4 · 单卡 vs 系统），数值仅为示意量级，不可直接横比；以规格表（Hardware/NVIDIA GPU 架构与规格）为准。</text>

</svg>
