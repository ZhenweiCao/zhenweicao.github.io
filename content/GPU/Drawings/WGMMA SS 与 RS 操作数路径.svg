<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" role="img" aria-labelledby="title desc">
  <title id="title">Hopper wgmma 指令的 SS 与 RS 操作数路径对比</title>
  <desc id="desc">对比 Hopper 架构 wgmma.mma_async 指令的两种操作数变体：SS 变体 A、B 都来自 SMEM，RS 变体 A 来自寄存器、B 来自 SMEM；展示从 HBM 到 TMA 到 SMEM/Reg 再到 wgmma 引擎以及累加器寄存器的数据流，并提示与 Ampere mma.sync 的差异以及 commit_group/wait_group 异步配套指令。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      text {
        font-family: Arial, Helvetica, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
        fill: #0f172a;
      }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #475569; }
      .label { font-size: 17px; font-weight: 700; }
      .small { font-size: 13px; fill: #475569; }
      .tiny { font-size: 11px; fill: #64748b; }
      .col { font-size: 18px; font-weight: 700; fill: #0f172a; }
      .mono { font-family: "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #334155; }
      .start { fill: #eef6ff; stroke: #2563eb; stroke-width: 1.8; rx: 10; }
      .metric { fill: #ecfdf5; stroke: #059669; stroke-width: 1.8; rx: 10; }
      .action { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.8; rx: 10; }
      .decision { fill: #fefce8; stroke: #ca8a04; stroke-width: 1.8; rx: 10; }
      .divider { stroke: #cbd5e1; stroke-width: 1.4; stroke-dasharray: 6 5; fill: none; }
      .arrow { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .arrow-dim { stroke: #94a3b8; stroke-width: 1.6; fill: none; marker-end: url(#arrow); stroke-dasharray: 5 4; }
    </style>
  </defs>

  <rect x="0" y="0" width="1240" height="800" fill="#f8fafc"/>

  <text x="50" y="48" class="title">WGMMA SS 与 RS 操作数路径</text>
  <text x="50" y="74" class="subtitle">Hopper wgmma.mma_async 的两种变体：SS 变体 A、B 均来自 SMEM；RS 变体 A 来自寄存器、B 来自 SMEM。累加器始终在寄存器。</text>

  <line x1="620" y1="100" x2="620" y2="640" class="divider"/>

  <text x="170" y="120" class="col">SS 变体：A、B 均来自 SMEM</text>
  <text x="170" y="142" class="mono">wgmma.mma_async.sync.aligned.m64nNk16.f32.f16.f16  {acc...}, desc_a, desc_b, ...</text>

  <text x="770" y="120" class="col">RS 变体：A 来自 Reg，B 来自 SMEM</text>
  <text x="770" y="142" class="mono">wgmma.mma_async.sync.aligned.m64nNk16.f32.f16.f16  {acc...}, {a_frag_regs...}, desc_b, ...</text>

  <rect x="220" y="170" width="220" height="60" class="start"/>
  <text x="246" y="198" class="label">HBM (Global Memory)</text>
  <text x="246" y="219" class="small">A、B 矩阵原始数据</text>

  <rect x="220" y="262" width="220" height="58" class="start"/>
  <text x="246" y="289" class="label">TMA bulk async copy</text>
  <text x="246" y="309" class="small">cp.async.bulk.tensor，张量描述符驱动</text>

  <rect x="125" y="352" width="200" height="64" class="start"/>
  <text x="151" y="380" class="label">SMEM: A tile</text>
  <text x="151" y="402" class="small">Swizzled layout，desc_a 描述</text>

  <rect x="335" y="352" width="200" height="64" class="start"/>
  <text x="361" y="380" class="label">SMEM: B tile</text>
  <text x="361" y="402" class="small">Swizzled layout，desc_b 描述</text>

  <rect x="220" y="448" width="220" height="68" class="metric"/>
  <text x="246" y="478" class="label">wgmma 引擎（Tensor Core）</text>
  <text x="246" y="500" class="small">m64 × N × k16 异步 MMA，warpgroup 级</text>

  <rect x="220" y="546" width="220" height="68" class="action"/>
  <text x="246" y="576" class="label">Accumulator (Reg)</text>
  <text x="246" y="598" class="small">FP32 / FP16 累加，分布于 128 线程</text>

  <text x="125" y="640" class="tiny">典型场景：标准 GEMM，A 与 B 都是片上 tile，由 producer warp 通过 TMA 加载到 SMEM。</text>

  <rect x="820" y="170" width="220" height="60" class="start"/>
  <text x="846" y="198" class="label">HBM (Global Memory)</text>
  <text x="846" y="219" class="small">A、B 矩阵原始数据</text>

  <rect x="820" y="262" width="220" height="58" class="start"/>
  <text x="846" y="289" class="label">TMA bulk async copy</text>
  <text x="846" y="309" class="small">或来自上游 epilogue / 已驻留 reg</text>

  <rect x="725" y="352" width="200" height="64" class="start"/>
  <text x="751" y="380" class="label">SMEM: A staging</text>
  <text x="751" y="402" class="small">A tile 暂存，再 ldmatrix → reg</text>

  <rect x="935" y="352" width="200" height="64" class="start"/>
  <text x="961" y="380" class="label">SMEM: B tile</text>
  <text x="961" y="402" class="small">仍走 SMEM，desc_b 描述</text>

  <rect x="725" y="448" width="200" height="64" class="start"/>
  <text x="751" y="476" class="label">Reg: A fragments</text>
  <text x="751" y="498" class="small">按 wgmma fragment 布局排列</text>

  <rect x="820" y="546" width="220" height="68" class="metric"/>
  <text x="846" y="576" class="label">wgmma 引擎（Tensor Core）</text>
  <text x="846" y="598" class="small">A 来自 reg，B 来自 SMEM</text>

  <rect x="1050" y="448" width="160" height="68" class="action"/>
  <text x="1068" y="478" class="label">Accumulator</text>
  <text x="1068" y="500" class="small">(Reg, FP32/FP16)</text>

  <text x="725" y="640" class="tiny">典型场景：epilogue fusion / persistent kernel 中 A 即上游产物（activation、softmax 输出），已在 reg 中。</text>

  <path d="M 330 230 L 330 262" class="arrow"/>
  <path d="M 330 320 L 225 352" class="arrow"/>
  <path d="M 330 320 L 435 352" class="arrow"/>
  <path d="M 225 416 L 295 448" class="arrow"/>
  <path d="M 435 416 L 365 448" class="arrow"/>
  <path d="M 330 516 L 330 546" class="arrow"/>

  <path d="M 930 230 L 930 262" class="arrow"/>
  <path d="M 930 320 L 825 352" class="arrow"/>
  <path d="M 930 320 L 1035 352" class="arrow"/>
  <path d="M 825 416 L 825 448" class="arrow"/>
  <path d="M 825 512 L 880 546" class="arrow"/>
  <path d="M 1035 416 L 990 546" class="arrow"/>
  <path d="M 1040 580 L 1050 482" class="arrow-dim"/>

  <rect x="80" y="668" width="1080" height="58" class="metric"/>
  <text x="105" y="694" class="label">通用约束</text>
  <text x="105" y="716" class="small">accumulator 始终在寄存器（FP32 / FP16）  ·  warpgroup = 4 warps = 128 threads，全员协同  ·  m=64 固定；n ∈ {8..256, 8 倍数}；k 取决于精度（FP16=16，FP8=32，TF32=8）</text>

  <rect x="80" y="740" width="1080" height="46" class="decision"/>
  <text x="105" y="769" class="small"><tspan font-weight="700" fill="#0f172a">⚠️ 与 Ampere mma.sync 不同：</tspan>wgmma 是 warpgroup 级 + 异步指令，发射后不阻塞，需用 wgmma.commit_group.sync + wgmma.wait_group.sync 显式同步累加器寄存器。</text>
</svg>
