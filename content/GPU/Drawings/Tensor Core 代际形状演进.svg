<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 760" role="img" aria-labelledby="title desc">
  <title id="title">NVIDIA Tensor Core 硬件原生 mma 形状跨代际演进</title>
  <desc id="desc">横向时间轴对比 Volta V100 / Ampere A100 / Hopper H100&amp;H200 / Blackwell B200&amp;B300 四代 Tensor Core 的硬件原生 mma 形状与关键能力，并提醒不要把 WMMA API tile 等同于硬件原生形状。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      text {
        font-family: Arial, Helvetica, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
        fill: #0f172a;
      }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #475569; }
      .label { font-size: 17px; font-weight: 700; }
      .small { font-size: 13px; fill: #475569; }
      .tiny { font-size: 11px; fill: #64748b; }
      .mat-lbl { font-size: 11px; fill: #334155; }
      .op { font-size: 18px; font-weight: 700; fill: #334155; }
      .v100 { fill: #eef6ff; stroke: #2563eb; stroke-width: 1.8; rx: 10; }
      .a100 { fill: #ecfdf5; stroke: #059669; stroke-width: 1.8; rx: 10; }
      .hopper { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.8; rx: 10; }
      .blackwell { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.8; rx: 10; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; rx: 10; }
      .mat { fill: #e2e8f0; stroke: #475569; stroke-width: 1.2; rx: 2; }
      .mat-accent { fill: #cbd5e1; stroke: #475569; stroke-width: 1.2; rx: 2; }
      .decision { fill: #fefce8; stroke: #ca8a04; stroke-width: 1.8; rx: 10; }
      .arrow { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="1480" height="760" fill="#f8fafc"/>

  <text x="50" y="58" class="title">NVIDIA Tensor Core 硬件原生 mma 形状跨代际演进</text>
  <text x="50" y="86" class="subtitle">Volta → Ampere → Hopper → Blackwell：mma 形状由 warp 级 8×8×4 演进到 warpgroup 级 wgmma，再到 tcgen05 + TMEM 与 block-scaled 低精度。</text>

  <!-- ===================== V100 ===================== -->
  <rect x="40" y="125" width="320" height="84" class="v100"/>
  <text x="60" y="156" class="label">Volta V100</text>
  <text x="60" y="178" class="small">sm_70 · 首代 Tensor Core</text>
  <text x="60" y="197" class="small">硬件原生 mma 形状：m8 n8 k4 (FP16)</text>

  <!-- Matrix viz V100: scale 5px/unit, A 8x4, B 4x8, C 8x8 -->
  <rect x="40" y="230" width="320" height="200" class="panel"/>
  <text x="60" y="253" class="small" style="font-weight:700;fill:#0f172a">mma.sync m8n8k4 (FP16×FP16→FP32)</text>
  <!-- A: m=8 rows x k=4 cols => 40 x 20 -->
  <rect x="80" y="280" width="20" height="40" class="mat"/>
  <text x="80" y="338" class="mat-lbl">A 8×4</text>
  <text x="115" y="305" class="op">×</text>
  <!-- B: k=4 rows x n=8 cols => 40 x 20 -->
  <rect x="140" y="280" width="40" height="20" class="mat"/>
  <text x="140" y="320" class="mat-lbl">B 4×8</text>
  <text x="195" y="305" class="op">=</text>
  <!-- C: m=8 x n=8 => 40 x 40 -->
  <rect x="220" y="280" width="40" height="40" class="mat-accent"/>
  <text x="220" y="338" class="mat-lbl">C 8×8</text>
  <text x="60" y="380" class="tiny">单位：1 cell ≈ 1 元素 · 1 warp 协作一次发射</text>
  <text x="60" y="400" class="tiny">⚠️ WMMA API tile 16×16×16 是软件层封装</text>
  <text x="60" y="418" class="tiny">       由多次 8×8×4 硬件指令拼接而成</text>

  <!-- Capabilities V100 -->
  <rect x="40" y="450" width="320" height="210" class="panel"/>
  <text x="60" y="478" class="label" style="font-size:15px">关键能力</text>
  <text x="60" y="503" class="small">· 首代 Tensor Core（640 个 / GPU）</text>
  <text x="60" y="524" class="small">· 仅支持 FP16 输入 / FP32 累加</text>
  <text x="60" y="545" class="small">· 通过 mma.sync.aligned.m8n8k4 暴露</text>
  <text x="60" y="566" class="small">· 8 线程一组 quad-pair 协作发射</text>
  <text x="60" y="587" class="small">· cuBLAS / WMMA 在其上封装更大 tile</text>
  <text x="60" y="616" class="tiny" style="fill:#475569">常见误区：把 nvcuda::wmma 的 16×16×16</text>
  <text x="60" y="634" class="tiny" style="fill:#475569">当成 V100 硬件原生形状（实为多次 8×8×4）</text>

  <!-- ===================== A100 ===================== -->
  <rect x="400" y="125" width="320" height="84" class="a100"/>
  <text x="420" y="156" class="label">Ampere A100</text>
  <text x="420" y="178" class="small">sm_80 · 第三代 Tensor Core</text>
  <text x="420" y="197" class="small">硬件原生 mma 形状：m16 n8 k16 (FP16/BF16)</text>

  <!-- Matrix viz A100: scale 3.5px/unit -->
  <rect x="400" y="230" width="320" height="200" class="panel"/>
  <text x="420" y="253" class="small" style="font-weight:700;fill:#0f172a">mma.sync m16n8k16 (FP16 / BF16 / TF32k8)</text>
  <!-- A: m=16 x k=16 => 56 x 56 -->
  <rect x="430" y="270" width="56" height="56" class="mat"/>
  <text x="430" y="345" class="mat-lbl">A 16×16</text>
  <text x="498" y="305" class="op">×</text>
  <!-- B: k=16 x n=8 => 28 x 56 -->
  <rect x="520" y="270" width="28" height="56" class="mat"/>
  <text x="520" y="345" class="mat-lbl">B 16×8</text>
  <text x="560" y="305" class="op">=</text>
  <!-- C: m=16 x n=8 => 28 x 56 -->
  <rect x="585" y="270" width="28" height="56" class="mat-accent"/>
  <text x="585" y="345" class="mat-lbl">C 16×8</text>
  <text x="420" y="380" class="tiny">单 warp（32 线程）一次发射；FP16/BF16 用 k=16</text>
  <text x="420" y="398" class="tiny">TF32 路径硬件形状为 m16n8k8（A 16×8 / B 8×8）</text>
  <text x="420" y="416" class="tiny">INT8 / INT4 路径 k 更大（k=32 / k=64）</text>

  <!-- Capabilities A100 -->
  <rect x="400" y="450" width="320" height="210" class="panel"/>
  <text x="420" y="478" class="label" style="font-size:15px">关键能力</text>
  <text x="420" y="503" class="small">· 加入 BF16 / TF32 / INT8 / INT4</text>
  <text x="420" y="524" class="small">· 2:4 结构化稀疏（mma.sp 翻倍吞吐）</text>
  <text x="420" y="545" class="small">· cp.async 异步 global → shared 拷贝</text>
  <text x="420" y="566" class="small">· 多缓冲 / 软件流水线成为主流</text>
  <text x="420" y="587" class="small">· L2 residency / SMEM 192KB · sm_80</text>
  <text x="420" y="616" class="tiny" style="fill:#475569">PTX：mma.sync.aligned.m16n8k16.row.col</text>
  <text x="420" y="634" class="tiny" style="fill:#475569">f32.f16.f16.f32</text>

  <!-- ===================== Hopper ===================== -->
  <rect x="760" y="125" width="320" height="84" class="hopper"/>
  <text x="780" y="156" class="label">Hopper H100 / H200</text>
  <text x="780" y="178" class="small">sm_90a · 第四代 Tensor Core</text>
  <text x="780" y="197" class="small">硬件原生：wgmma m64nNk16 (FP16/BF16) · k32 (FP8)</text>

  <!-- Matrix viz Hopper: scale 1.2px/unit but truncate -->
  <rect x="760" y="230" width="320" height="200" class="panel"/>
  <text x="780" y="253" class="small" style="font-weight:700;fill:#0f172a">wgmma.mma_async m64nNk16 / k32  (N∈{8..256, step 8})</text>
  <!-- A: m=64 x k=16 => 32 x 80, but cap visualization -->
  <rect x="780" y="265" width="22" height="80" class="mat"/>
  <text x="780" y="362" class="mat-lbl">A 64×16</text>
  <text x="813" y="310" class="op">×</text>
  <!-- B: k=16 x n=128 (repr.) => truncated -->
  <rect x="830" y="265" width="160" height="22" class="mat"/>
  <text x="830" y="304" class="mat-lbl">B 16×N  (N≤256)</text>
  <!-- truncation dashes on B right edge -->
  <line x1="990" y1="265" x2="990" y2="287" stroke="#475569" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="993" y="280" class="mat-lbl">…</text>
  <text x="813" y="362" class="op">=</text>
  <!-- C: m=64 x n=128 (repr.) => 160 x 80 truncated -->
  <rect x="830" y="295" width="160" height="50" class="mat-accent"/>
  <text x="830" y="362" class="mat-lbl">C 64×N</text>
  <line x1="990" y1="295" x2="990" y2="345" stroke="#475569" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="780" y="385" class="tiny">128 线程 warpgroup 协作；A 可在 SMEM 或 RF，B 必在 SMEM</text>
  <text x="780" y="402" class="tiny">异步发射 + commit_group / wait_group 流水</text>
  <text x="780" y="418" class="tiny">N 步长 8；FP8 (E4M3 / E5M2) 走 k=32 路径</text>

  <!-- Capabilities Hopper -->
  <rect x="760" y="450" width="320" height="210" class="panel"/>
  <text x="780" y="478" class="label" style="font-size:15px">关键能力</text>
  <text x="780" y="503" class="small">· warpgroup MMA（4 warps = 128 lanes）</text>
  <text x="780" y="524" class="small">· TMA：bulk 异步张量搬运 + multicast</text>
  <text x="780" y="545" class="small">· FP8 (E4M3 / E5M2) 原生输入</text>
  <text x="780" y="566" class="small">· Thread Block Cluster + DSMEM</text>
  <text x="780" y="587" class="small">· 寄存器 setmaxnreg / 异步屏障</text>
  <text x="780" y="616" class="tiny" style="fill:#475569">PTX：wgmma.mma_async.sync.aligned</text>
  <text x="780" y="634" class="tiny" style="fill:#475569">.m64n128k16.f32.f16.f16  (示例)</text>

  <!-- ===================== Blackwell ===================== -->
  <rect x="1120" y="125" width="320" height="84" class="blackwell"/>
  <text x="1140" y="156" class="label">Blackwell B200 / B300</text>
  <text x="1140" y="178" class="small">sm_100 · 第五代 Tensor Core</text>
  <text x="1140" y="197" class="small">硬件原生：tcgen05.mma · 累加器落 TMEM</text>

  <!-- Matrix viz Blackwell: tcgen05 schematic + TMEM block -->
  <rect x="1120" y="230" width="320" height="200" class="panel"/>
  <text x="1140" y="253" class="small" style="font-weight:700;fill:#0f172a">tcgen05.mma  +  TMEM 累加 (256 KB / SM)</text>
  <!-- A block -->
  <rect x="1140" y="272" width="30" height="70" class="mat"/>
  <text x="1140" y="358" class="mat-lbl">A (SMEM)</text>
  <text x="1180" y="313" class="op">×</text>
  <!-- B block, truncated -->
  <rect x="1200" y="272" width="120" height="22" class="mat"/>
  <text x="1200" y="312" class="mat-lbl">B (SMEM, N 大)</text>
  <line x1="1320" y1="272" x2="1320" y2="294" stroke="#475569" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="1180" y="358" class="op">→</text>
  <!-- TMEM accumulator -->
  <rect x="1200" y="305" width="120" height="40" fill="#fee2e2" stroke="#ea580c" stroke-width="1.4" rx="3"/>
  <text x="1207" y="328" class="mat-lbl" style="font-weight:700;fill:#9a3412">D ⇒ TMEM</text>
  <text x="1207" y="342" class="mat-lbl" style="fill:#9a3412">256 KB / SM</text>
  <text x="1140" y="385" class="tiny">block-scaled 路径：MXFP4 块大小 32 · NVFP4 块大小 16</text>
  <text x="1140" y="402" class="tiny">缩放因子 dtype：E8M0（MX）/ FP8 E4M3（NV）</text>
  <text x="1140" y="418" class="tiny">支持 FP4 / FP6 / FP8 / BF16 / TF32 等多种输入</text>

  <!-- Capabilities Blackwell -->
  <rect x="1120" y="450" width="320" height="210" class="panel"/>
  <text x="1140" y="478" class="label" style="font-size:15px">关键能力</text>
  <text x="1140" y="503" class="small">· 累加器搬到 TMEM，释放寄存器压力</text>
  <text x="1140" y="524" class="small">· block-scaled FP4 / FP6 / FP8 原生</text>
  <text x="1140" y="545" class="small">· 双 SM 协同 (CTA-pair) tcgen05.mma</text>
  <text x="1140" y="566" class="small">· 第 2 代 TMA + 张量内存调度</text>
  <text x="1140" y="587" class="small">· 微缩放：MX (块 32) / NV (块 16)</text>
  <text x="1140" y="616" class="tiny" style="fill:#475569">PTX：tcgen05.mma.* + tcgen05.ld/st</text>
  <text x="1140" y="634" class="tiny" style="fill:#475569">cuBLAS / CUTLASS 3.x 已封装</text>

  <!-- ===================== Time arrows ===================== -->
  <path d="M 362 167 L 398 167" class="arrow"/>
  <path d="M 722 167 L 758 167" class="arrow"/>
  <path d="M 1082 167 L 1118 167" class="arrow"/>

  <!-- ===================== Bottom callout ===================== -->
  <rect x="50" y="680" width="1380" height="60" class="decision"/>
  <text x="72" y="708" class="label" style="font-size:15px">⚠️ 不要把 WMMA API tile 当成硬件原生 mma 形状</text>
  <text x="72" y="730" class="small">例如把 V100 写成 “16×16×16” 是常见错误——那是 nvcuda::wmma 的软件 tile；V100 硬件原生只能发 m8 n8 k4，更大的 tile 由编译器拆成多条 mma.sync。Ampere 之后请用 mma.sync / wgmma / tcgen05 的形状描述。</text>
</svg>
