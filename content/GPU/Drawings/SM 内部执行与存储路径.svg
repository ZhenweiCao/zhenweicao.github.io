<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">SM 内部执行与存储路径</title>
  <desc id="desc">展示一个 SM 内部 warp scheduler、register file、CUDA Core、Tensor Core、LD/ST、shared memory 和 L2/HBM 之间的概念性数据路径。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      text {
        font-family: Arial, Helvetica, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
        fill: #0f172a;
      }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #475569; }
      .label { font-size: 17px; font-weight: 700; }
      .small { font-size: 13px; fill: #475569; }
      .tiny { font-size: 11px; fill: #64748b; }
      .sm { fill: #fefce8; stroke: #ca8a04; stroke-width: 2; rx: 14; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 1.5; rx: 8; }
      .unit { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.3; rx: 8; }
      .compute { fill: #eef6ff; stroke: #2563eb; stroke-width: 1.6; rx: 8; }
      .tensor { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.6; rx: 8; }
      .memory { fill: #ecfdf5; stroke: #059669; stroke-width: 1.6; rx: 8; }
      .external { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.6; rx: 8; }
      .arrow { stroke: #334155; stroke-width: 1.9; fill: none; marker-end: url(#arrow); }
      .both { stroke: #334155; stroke-width: 1.8; fill: none; marker-end: url(#arrow); marker-start: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 1.4; stroke-dasharray: 5 5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="720" fill="#f8fafc"/>
  <text x="50" y="58" class="title">SM 内部执行与存储路径</text>
  <text x="50" y="86" class="subtitle">概念图：真实 SM 的分区、scheduler 数量和端口因架构而异；这里强调 kernel 优化时最常遇到的路径。</text>

  <rect x="65" y="120" width="850" height="535" class="sm"/>
  <text x="95" y="155" class="label">一个 SM（Streaming Multiprocessor）</text>
  <text x="350" y="155" class="small">一个或多个 CTA 驻留在这里；warp scheduler 在 ready warp 中选择指令发射。</text>

  <rect x="95" y="195" width="210" height="120" class="unit"/>
  <text x="120" y="225" class="label">Warp Schedulers</text>
  <text x="120" y="253" class="small">选择 ready warp</text>
  <text x="120" y="277" class="small">发射 SIMT / MMA / LDST 指令</text>

  <rect x="350" y="195" width="215" height="120" class="memory"/>
  <text x="375" y="225" class="label">Register File</text>
  <text x="375" y="253" class="small">thread 私有状态</text>
  <text x="375" y="277" class="small">accumulator / 指针 / 临时变量</text>

  <rect x="610" y="185" width="255" height="72" class="compute"/>
  <text x="635" y="215" class="label">CUDA Cores</text>
  <text x="635" y="239" class="small">FP32 / INT32 / 标量 SIMT</text>

  <rect x="610" y="280" width="255" height="84" class="tensor"/>
  <text x="635" y="312" class="label">Tensor Cores</text>
  <text x="635" y="338" class="small">MMA：FP16 / BF16 / TF32 / FP8 / FP4...</text>

  <rect x="610" y="395" width="255" height="72" class="compute"/>
  <text x="635" y="425" class="label">LD/ST Units</text>
  <text x="635" y="449" class="small">global / shared / local load-store</text>

  <rect x="350" y="405" width="215" height="120" class="memory"/>
  <text x="375" y="435" class="label">Shared Memory / L1</text>
  <text x="375" y="463" class="small">CTA 内共享片上 SRAM</text>
  <text x="375" y="487" class="small">tile 缓存、数据重排、bank conflict</text>

  <rect x="95" y="405" width="210" height="120" class="unit"/>
  <text x="120" y="435" class="label">CTA / Block State</text>
  <text x="120" y="463" class="small">threadIdx / blockIdx</text>
  <text x="120" y="487" class="small">barrier / __syncthreads()</text>

  <path d="M 305 255 L 350 255" class="arrow"/>
  <path d="M 565 230 L 610 220" class="arrow"/>
  <path d="M 565 255 L 610 322" class="arrow"/>
  <path d="M 565 285 L 610 430" class="arrow"/>
  <path d="M 610 220 L 565 230" class="arrow"/>
  <path d="M 610 322 L 565 255" class="arrow"/>
  <path d="M 610 430 L 565 285" class="arrow"/>
  <path d="M 457 315 L 457 405" class="both"/>
  <path d="M 565 465 L 610 430" class="both"/>
  <path d="M 305 465 L 350 465" class="dash"/>

  <text x="505" y="370" class="tiny">register ↔ SMEM</text>
  <text x="673" y="275" class="tiny">SIMT ALU</text>
  <text x="665" y="383" class="tiny">ldmatrix / wgmma / tcgen05 路径常与 SMEM/layout 绑定</text>

  <rect x="955" y="170" width="190" height="90" class="external"/>
  <text x="980" y="202" class="label">L2 Cache</text>
  <text x="980" y="229" class="small">跨 SM 共享</text>

  <rect x="955" y="320" width="190" height="90" class="external"/>
  <text x="980" y="352" class="label">HBM</text>
  <text x="980" y="379" class="small">global memory</text>

  <path d="M 865 430 C 920 430 915 215 955 215" class="both"/>
  <path d="M 1050 260 L 1050 320" class="both"/>
  <text x="930" y="492" class="tiny">global load/store 经 L2/HBM；shared memory 是 SM 内片上资源。</text>

  <rect x="95" y="565" width="770" height="55" class="box"/>
  <text x="120" y="590" class="small">优化直觉：Tensor Core 吃不饱时看 tile、MMA 指令和发射；HBM 吃满时看复用、coalescing、cache；SMEM stall 多时看 bank conflict 和同步。</text>
  <text x="120" y="612" class="small">CTA 的协作边界是 shared memory + barrier；cluster 才把多个 CTA 的 shared memory 组织成 DSMEM。</text>
</svg>
