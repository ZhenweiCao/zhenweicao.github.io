<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">GPU 硬件背景地图</title>
  <desc id="desc">面向 GPU 初学者的硬件背景地图，从软件调用、执行层次、SM 内部、内存层次、系统互联到 profiling 观察点。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      text {
        font-family: Arial, Helvetica, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
        fill: #0f172a;
      }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #475569; }
      .label { font-size: 17px; font-weight: 700; }
      .small { font-size: 13px; fill: #475569; }
      .tiny { font-size: 11px; fill: #64748b; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 1.4; rx: 10; }
      .soft { fill: #eef6ff; stroke: #2563eb; stroke-width: 1.8; rx: 10; }
      .exec { fill: #ecfdf5; stroke: #059669; stroke-width: 1.8; rx: 10; }
      .sm { fill: #fefce8; stroke: #ca8a04; stroke-width: 1.8; rx: 10; }
      .mem { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.8; rx: 10; }
      .sys { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.8; rx: 10; }
      .arrow { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 6 5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="800" fill="#f8fafc"/>
  <text x="50" y="58" class="title">GPU 硬件背景地图</text>
  <text x="50" y="86" class="subtitle">读 GPU kernel 时先问 6 个问题：谁发起？谁执行？在哪个 SM？数据在哪里？跨 GPU 怎么走？用什么指标验证？</text>

  <rect x="70" y="135" width="255" height="118" class="soft"/>
  <text x="100" y="170" class="label">1. 软件入口</text>
  <text x="100" y="200" class="small">Python / C++ / CUDA Runtime</text>
  <text x="100" y="224" class="small">kernel launch、stream、library call</text>

  <rect x="395" y="135" width="255" height="118" class="exec"/>
  <text x="425" y="170" class="label">2. 执行层次</text>
  <text x="425" y="200" class="small">Grid -> CTA/Block -> Warp -> Thread</text>
  <text x="425" y="224" class="small">threadIdx / blockIdx 决定数据分工</text>

  <rect x="720" y="135" width="255" height="118" class="sm"/>
  <text x="750" y="170" class="label">3. SM 内部</text>
  <text x="750" y="200" class="small">warp scheduler、register、SMEM</text>
  <text x="750" y="224" class="small">CUDA Core / Tensor Core / LDST</text>

  <rect x="395" y="340" width="255" height="118" class="mem"/>
  <text x="425" y="375" class="label">4. 内存层次</text>
  <text x="425" y="405" class="small">Register / SMEM / L2 / HBM</text>
  <text x="425" y="429" class="small">少搬、顺搬、多复用</text>

  <rect x="720" y="340" width="255" height="118" class="sys"/>
  <text x="750" y="375" class="label">5. 系统互联</text>
  <text x="750" y="405" class="small">PCIe / NVLink / NVSwitch</text>
  <text x="750" y="429" class="small">多 GPU、通信、KV/权重分布</text>

  <rect x="1020" y="238" width="215" height="118" class="box"/>
  <text x="1045" y="273" class="label">6. Profiling</text>
  <text x="1045" y="303" class="small">nsys 看 timeline</text>
  <text x="1045" y="327" class="small">ncu 看 kernel 指标</text>

  <path d="M 325 194 L 395 194" class="arrow"/>
  <path d="M 650 194 L 720 194" class="arrow"/>
  <path d="M 848 253 C 848 312 522 282 522 340" class="arrow"/>
  <path d="M 650 399 L 720 399" class="arrow"/>
  <path d="M 975 399 C 1040 399 1040 356 1090 356" class="arrow"/>
  <path d="M 975 194 C 1070 194 1090 238 1090 238" class="dash"/>

  <rect x="105" y="590" width="1070" height="95" class="box"/>
  <text x="135" y="622" class="label">初学者读图口诀</text>
  <text x="135" y="652" class="small">一个 kernel 不是“一段代码跑一次”，而是“很多 thread 在很多 SM 上跑同一段代码”。性能优化不是只加线程，而是让 warp 顺利发指令、让数据少走 HBM、让 Tensor Core/SM 尽量持续有活干。</text>
  <text x="135" y="678" class="small">如果看不懂优化建议，先把它放回这张图里：它是在改执行分工、SM 资源、内存路径、系统通信，还是 profiling 方法？</text>
</svg>
