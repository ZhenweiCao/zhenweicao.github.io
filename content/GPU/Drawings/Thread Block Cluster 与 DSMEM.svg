<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Thread Block Cluster 与 Distributed Shared Memory</title>
  <desc id="desc">展示 Hopper 之后 Thread Block Cluster 中多个 CTA 被协同调度到一组 SM，并通过 Distributed Shared Memory 访问彼此 shared memory 的概念。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      text {
        font-family: Arial, Helvetica, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
        fill: #0f172a;
      }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #475569; }
      .label { font-size: 17px; font-weight: 700; }
      .small { font-size: 13px; fill: #475569; }
      .tiny { font-size: 11px; fill: #64748b; }
      .cluster { fill: #eef6ff; stroke: #2563eb; stroke-width: 2; rx: 14; }
      .sm { fill: #fefce8; stroke: #ca8a04; stroke-width: 1.5; rx: 9; }
      .cta { fill: #ffffff; stroke: #334155; stroke-width: 1.2; rx: 7; }
      .smem { fill: #ecfdf5; stroke: #059669; stroke-width: 1.4; rx: 7; }
      .mem { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.6; rx: 8; }
      .note { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.2; rx: 8; }
      .arrow { stroke: #334155; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .both { stroke: #334155; stroke-width: 1.7; fill: none; marker-end: url(#arrow); marker-start: url(#arrow); }
      .remote { stroke: #059669; stroke-width: 2; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); marker-start: url(#arrow); }
      .multi { stroke: #ea580c; stroke-width: 1.8; stroke-dasharray: 5 4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="720" fill="#f8fafc"/>
  <text x="50" y="58" class="title">Thread Block Cluster 与 DSMEM</text>
  <text x="50" y="86" class="subtitle">关键点：CTA 仍驻留在一个 SM 上；cluster 让多个 CTA 协同调度，并访问彼此的 shared memory。</text>

  <rect x="70" y="120" width="1060" height="465" class="cluster"/>
  <text x="100" y="155" class="label">一个 Thread Block Cluster（概念上位于同一个 GPC 内）</text>
  <text x="485" y="155" class="small">cluster 内 CTA 可以同步；DSMEM = cluster 内各 CTA shared memory 的逻辑地址空间。</text>

  <g>
    <rect x="120" y="195" width="220" height="150" class="sm"/>
    <text x="145" y="223" class="label">SM 0</text>
    <rect x="145" y="240" width="75" height="44" class="cta"/>
    <text x="162" y="267" class="small">CTA 0</text>
    <rect x="235" y="240" width="80" height="44" class="smem"/>
    <text x="248" y="267" class="small">SMEM 0</text>
    <text x="145" y="315" class="tiny">CTA 0 本地 shared memory</text>
  </g>

  <g>
    <rect x="390" y="195" width="220" height="150" class="sm"/>
    <text x="415" y="223" class="label">SM 1</text>
    <rect x="415" y="240" width="75" height="44" class="cta"/>
    <text x="432" y="267" class="small">CTA 1</text>
    <rect x="505" y="240" width="80" height="44" class="smem"/>
    <text x="518" y="267" class="small">SMEM 1</text>
    <text x="415" y="315" class="tiny">CTA 1 本地 shared memory</text>
  </g>

  <g>
    <rect x="120" y="390" width="220" height="150" class="sm"/>
    <text x="145" y="418" class="label">SM 2</text>
    <rect x="145" y="435" width="75" height="44" class="cta"/>
    <text x="162" y="462" class="small">CTA 2</text>
    <rect x="235" y="435" width="80" height="44" class="smem"/>
    <text x="248" y="462" class="small">SMEM 2</text>
    <text x="145" y="510" class="tiny">CTA 2 本地 shared memory</text>
  </g>

  <g>
    <rect x="390" y="390" width="220" height="150" class="sm"/>
    <text x="415" y="418" class="label">SM 3</text>
    <rect x="415" y="435" width="75" height="44" class="cta"/>
    <text x="432" y="462" class="small">CTA 3</text>
    <rect x="505" y="435" width="80" height="44" class="smem"/>
    <text x="518" y="462" class="small">SMEM 3</text>
    <text x="415" y="510" class="tiny">CTA 3 本地 shared memory</text>
  </g>

  <path d="M 315 262 L 505 262" class="remote"/>
  <path d="M 275 284 C 275 365 545 355 545 435" class="remote"/>
  <path d="M 315 457 L 505 457" class="remote"/>
  <path d="M 275 435 C 275 355 545 365 545 284" class="remote"/>
  <text x="665" y="254" class="label">Distributed Shared Memory</text>
  <text x="665" y="284" class="small">cluster 内任一 CTA 可以访问其他 CTA 的 SMEM</text>
  <text x="665" y="310" class="small">remote SMEM 通常比 local SMEM 更贵，不是免费大缓存</text>
  <text x="665" y="336" class="small">所有参与 CTA 必须存在，常配合 cluster sync 使用</text>
  <path d="M 645 300 C 610 300 595 285 585 272" class="arrow"/>

  <rect x="760" y="385" width="300" height="100" class="note"/>
  <text x="785" y="416" class="label">不要误解</text>
  <text x="785" y="446" class="small">CTA 不会跨多个 SM 执行。</text>
  <text x="785" y="470" class="small">跨 SM 共享的是 cluster 内 CTA 的 SMEM 地址空间。</text>

  <rect x="155" y="620" width="210" height="54" class="mem"/>
  <text x="182" y="651" class="label">HBM / Global</text>

  <rect x="495" y="620" width="210" height="54" class="mem"/>
  <text x="545" y="651" class="label">L2 Cache</text>

  <path d="M 365 647 L 495 647" class="both"/>
  <path d="M 600 620 C 600 590 600 555 585 500" class="multi"/>
  <path d="M 600 620 C 525 585 360 555 315 457" class="multi"/>
  <path d="M 600 620 C 480 545 400 335 315 262" class="multi"/>
  <text x="735" y="648" class="small">TMA multicast 可把一份 global 数据搬到多个 CTA 的 SMEM，减少重复 HBM 读取。</text>
</svg>
