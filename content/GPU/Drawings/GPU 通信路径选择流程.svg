<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">GPU 通信路径选择流程</title>
  <desc id="desc">展示 GPU 通信按片内、同机多卡、跨机、存储访问选择 DSMEM、NVLink、PCIe P2P、GPUDirect RDMA 或 GPUDirect Storage 的流程。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .title { font-size: 32px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #475569; }
      .node { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 8; }
      .decision { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; }
      .intra { fill: #fefce8; stroke: #ca8a04; stroke-width: 2; rx: 8; }
      .nvl { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; rx: 8; }
      .rdma { fill: #ecfdf5; stroke: #059669; stroke-width: 2; rx: 8; }
      .storage { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; rx: 8; }
      .fallback { fill: #fef2f2; stroke: #b91c1c; stroke-width: 2; rx: 8; }
      .label { font-size: 18px; font-weight: 700; }
      .body { font-size: 14px; fill: #475569; }
      .small { font-size: 12px; fill: #64748b; }
      .arrow { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .arrow-blue { stroke: #2563eb; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .arrow-green { stroke: #059669; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .arrow-red { stroke: #b91c1c; stroke-width: 2; fill: none; marker-end: url(#arrow); stroke-dasharray: 6 4; }
    </style>
  </defs>
  <rect x="0" y="0" width="1280" height="760" fill="#f8fafc"/>
  <text x="52" y="60" class="title">GPU 通信路径选择流程</text>
  <text x="52" y="90" class="subtitle">先判断通信边界，再选硬件通路；不要把 DSMEM、NVLink、GPUDirect RDMA 混成一层</text>

  <rect x="500" y="122" width="280" height="64" class="node"/>
  <text x="640" y="150" text-anchor="middle" class="label">要搬的数据在哪里？</text>
  <text x="640" y="172" text-anchor="middle" class="small">GPU memory / host memory / storage</text>

  <path d="M 640 186 L 640 222" class="arrow"/>
  <path d="M 570 222 L 710 222 L 760 282 L 710 342 L 570 342 L 520 282 Z" class="decision"/>
  <text x="640" y="274" text-anchor="middle" class="label">通信是否离开</text>
  <text x="640" y="298" text-anchor="middle" class="label">当前 GPU？</text>

  <path d="M 520 282 L 260 282 L 260 342" class="arrow"/>
  <text x="390" y="264" class="small">否，单 GPU 内</text>
  <rect x="100" y="342" width="320" height="118" class="intra"/>
  <text x="260" y="374" text-anchor="middle" class="label">片内路径</text>
  <text x="120" y="402" class="body">Thread / Warp / CTA</text>
  <text x="120" y="426" class="body">Shared Memory / L2 / HBM</text>
  <text x="120" y="450" class="body">Cluster DSMEM 走 SM-to-SM fabric</text>

  <path d="M 760 282 L 995 282 L 995 342" class="arrow"/>
  <text x="870" y="264" class="small">是，多设备</text>
  <path d="M 865 342 L 1125 342 L 1175 402 L 1125 462 L 865 462 L 815 402 Z" class="decision"/>
  <text x="995" y="394" text-anchor="middle" class="label">目标在同一台</text>
  <text x="995" y="418" text-anchor="middle" class="label">机器内？</text>

  <path d="M 995 462 L 995 510" class="arrow-blue"/>
  <text x="1010" y="492" class="small">是</text>
  <rect x="810" y="510" width="370" height="142" class="nvl"/>
  <text x="995" y="542" text-anchor="middle" class="label">同机多卡路径</text>
  <text x="835" y="570" class="body">优先：NVLink / NVSwitch</text>
  <text x="835" y="594" class="body">否则：PCIe P2P</text>
  <text x="835" y="618" class="body">入口：cudaMemcpyPeer / CUDA IPC / NCCL</text>
  <text x="835" y="642" class="small">场景：TP、同机 EP、同机 KV 拷贝</text>

  <path d="M 815 402 L 640 402 L 640 510" class="arrow-green"/>
  <text x="710" y="384" class="small">否，跨节点</text>
  <rect x="455" y="510" width="370" height="142" class="rdma"/>
  <text x="640" y="542" text-anchor="middle" class="label">跨机 GPU 数据路径</text>
  <text x="480" y="570" class="body">优先：GPUDirect RDMA</text>
  <text x="480" y="594" class="body">网络：InfiniBand / RoCE</text>
  <text x="480" y="618" class="body">入口：NCCL NET / NVSHMEM / NIXL / DeepEP</text>
  <text x="480" y="642" class="small">要求：GPU-NIC P2P、MR 注册、GID/HCA 正确</text>

  <path d="M 570 342 L 335 510" class="arrow-red"/>
  <rect x="100" y="510" width="320" height="142" class="fallback"/>
  <text x="260" y="542" text-anchor="middle" class="label">退化路径</text>
  <text x="125" y="570" class="body">GPU -> Host pinned buffer</text>
  <text x="125" y="594" class="body">Host -> NIC / PCIe root complex</text>
  <text x="125" y="618" class="body">延迟和 CPU/内存带宽开销上升</text>
  <text x="125" y="642" class="small">常见原因：MR 注册失败、拓扑不支持 P2P</text>

  <rect x="100" y="122" width="320" height="118" class="storage"/>
  <text x="260" y="154" text-anchor="middle" class="label">如果来源是存储</text>
  <text x="125" y="182" class="body">NVMe / NFS / NVMe-oF</text>
  <text x="125" y="206" class="body">优先：GPUDirect Storage</text>
  <text x="125" y="230" class="small">GPU memory 与存储 DMA，避免 host bounce</text>
  <path d="M 420 181 L 500 154" class="arrow"/>

  <rect x="52" y="694" width="1176" height="38" class="node"/>
  <text x="70" y="718" class="body">经验：能留在片内就不要出卡；能走 NVLink 就不要走 PCIe；跨机能走 GDR 就不要 host bounce；真正瓶颈用 nsys / NCCL 日志 / perftest 验证。</text>
</svg>
