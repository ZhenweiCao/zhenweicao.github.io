<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">CUDA Stream 顺序与并发</title>
  <desc id="desc">展示 CUDA stream 是按序队列：同一 stream 内操作按提交顺序执行，不同 stream 之间可用 event 建立依赖，并且是否真正并发取决于硬件资源和依赖关系。</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .lane { fill: #eef6ff; stroke: #bfdbfe; stroke-width: 1.2; }
      .lane2 { fill: #f0fdf4; stroke: #bbf7d0; stroke-width: 1.2; }
      .op1 { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.4; }
      .op2 { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.4; }
      .op3 { fill: #fef3c7; stroke: #d97706; stroke-width: 1.4; }
      .event { fill: #fce7f3; stroke: #db2777; stroke-width: 1.4; }
      .bar { stroke: #64748b; stroke-width: 2; stroke-dasharray: 5 5; }
      .arrow { stroke: #475569; stroke-width: 1.8; fill: none; marker-end: url(#arrowhead); }
      .eventArrow { stroke: #db2777; stroke-width: 1.8; fill: none; marker-end: url(#pinkArrow); stroke-dasharray: 6 4; }
      .title { font: 700 24px Arial, Helvetica, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .label { font: 700 15px Arial, Helvetica, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .body { font: 14px Arial, Helvetica, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .small { font: 12px Arial, Helvetica, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .tiny { font: 11px Arial, Helvetica, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #64748b; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#475569" />
    </marker>
    <marker id="pinkArrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#db2777" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1120" height="520" />
  <text class="title" x="48" y="56">CUDA Stream：按序队列 + 显式依赖</text>
  <text class="body" x="48" y="84">同一 stream 内 FIFO；不同 stream 可以重叠，但要靠 event / wait 建立必要依赖，实际并发取决于硬件资源。</text>

  <rect class="panel" x="48" y="120" width="1024" height="330" rx="8" />

  <text class="label" x="78" y="160">Host 提交顺序</text>
  <line class="arrow" x1="190" y1="156" x2="1015" y2="156" />
  <text class="tiny" x="990" y="144">time</text>

  <rect class="lane" x="78" y="190" width="920" height="82" rx="8" />
  <text class="label" x="100" y="221">stream 0</text>
  <rect class="op1" x="230" y="205" width="150" height="42" rx="6" />
  <text class="small" x="257" y="231">H2D copy</text>
  <rect class="op2" x="410" y="205" width="170" height="42" rx="6" />
  <text class="small" x="455" y="231">kernel A</text>
  <rect class="event" x="610" y="205" width="88" height="42" rx="6" />
  <text class="small" x="632" y="231">event</text>
  <rect class="op3" x="730" y="205" width="150" height="42" rx="6" />
  <text class="small" x="763" y="231">D2H copy</text>

  <rect class="lane2" x="78" y="310" width="920" height="82" rx="8" />
  <text class="label" x="100" y="341">stream 1</text>
  <rect class="op2" x="250" y="325" width="150" height="42" rx="6" />
  <text class="small" x="293" y="351">kernel B</text>
  <rect class="op1" x="650" y="325" width="180" height="42" rx="6" />
  <text class="small" x="683" y="351">kernel C waits</text>

  <path class="eventArrow" d="M654 248 C654 285 718 289 718 324" />
  <text class="tiny" x="735" y="292">cudaStreamWaitEvent</text>

  <line class="bar" x1="210" y1="188" x2="210" y2="395" />
  <text class="tiny" x="185" y="415">可并发开始</text>
  <line class="bar" x1="900" y1="188" x2="900" y2="395" />
  <text class="tiny" x="870" y="415">显式同步后读结果</text>

  <text class="small" x="78" y="474">注意：stream 是 runtime 队列，不是 SM、warp 或硬件流水线；多个 stream 只是表达“可并发”，不保证一定并发。</text>
</svg>
