<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2f4f5f"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2a33; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #4d5b66; }
      .label { font-size: 18px; font-weight: 700; }
      .small { font-size: 14px; fill: #394956; }
      .tiny { font-size: 12px; fill: #53636f; }
      .box { fill: #f8fafc; stroke: #516273; stroke-width: 1.4; rx: 6; }
      .blue { fill: #e6f0ff; stroke: #3567a8; }
      .green { fill: #e8f5ec; stroke: #3c7b52; }
      .amber { fill: #fff3dc; stroke: #a66c1f; }
      .pink { fill: #fdecef; stroke: #9c3f5d; }
      .purple { fill: #eeeafb; stroke: #6550a8; }
      .line { stroke: #2f4f5f; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 6 5; }
      .note { fill: #ffffff; stroke: #9aa8b5; stroke-width: 1; rx: 5; }
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>
  <text x="48" y="50" class="title">Blackwell tcgen05.mma 与 Tensor Memory 数据通路</text>
  <text x="48" y="78" class="subtitle">核心变化：accumulator D 与 scale 矩阵进入 TMEM；MMA 通过 descriptor / tmem address / mbarrier 组织异步流水线。</text>

  <rect x="46" y="115" width="190" height="95" class="box blue"/>
  <text x="68" y="150" class="label">Global Memory</text>
  <text x="68" y="176" class="small">A / B tiles</text>
  <text x="68" y="198" class="small">SFA / SFB scales</text>

  <rect x="290" y="115" width="190" height="95" class="box green"/>
  <text x="326" y="150" class="label">TMA / bulk copy</text>
  <text x="318" y="176" class="small">GMEM -> SMEM</text>
  <text x="322" y="198" class="small">mbarrier notify</text>

  <rect x="535" y="92" width="230" height="145" class="box amber"/>
  <text x="586" y="127" class="label">Shared Memory</text>
  <text x="566" y="155" class="small">A/B swizzled tiles</text>
  <text x="566" y="177" class="small">scale staging</text>
  <text x="566" y="199" class="small">matrix descriptor source</text>
  <text x="566" y="221" class="tiny">generic proxy writes need fence.proxy.async</text>

  <rect x="825" y="92" width="395" height="235" class="box purple"/>
  <text x="946" y="127" class="label">Tensor Memory (TMEM)</text>
  <text x="858" y="155" class="small">32-bit address = lane index + column index</text>
  <text x="858" y="177" class="small">dynamic allocation by columns; column covers 128 lanes</text>
  <text x="858" y="199" class="small">D accumulator lives here; SFA/SFB also loaded here</text>
  <rect x="858" y="220" width="330" height="74" class="note"/>
  <text x="878" y="247" class="small">warpgroup lane ownership</text>
  <text x="878" y="270" class="tiny">warp0: lanes 0-31, warp1: 32-63, warp2: 64-95, warp3: 96-127</text>
  <text x="878" y="288" class="tiny">whole TMEM access normally needs 4 warps</text>

  <rect x="86" y="410" width="250" height="95" class="box"/>
  <text x="120" y="445" class="label">tcgen05.alloc</text>
  <text x="112" y="471" class="small">alloc 32..512 columns</text>
  <text x="112" y="493" class="small">power-of-2 column count</text>

  <rect x="386" y="390" width="260" height="135" class="box pink"/>
  <text x="452" y="425" class="label">tcgen05.cp</text>
  <text x="416" y="453" class="small">SMEM -> TMEM async copy</text>
  <text x="416" y="475" class="small">optional 4/6-bit -> 8-bit decompress</text>
  <text x="416" y="497" class="small">same cta_group as mma</text>

  <rect x="700" y="372" width="275" height="170" class="box blue"/>
  <text x="782" y="407" class="label">tcgen05.mma</text>
  <text x="732" y="436" class="small">A: SMEM descriptor or A-TMEM</text>
  <text x="732" y="459" class="small">B: SMEM descriptor</text>
  <text x="732" y="482" class="small">D: TMEM accumulator</text>
  <text x="732" y="505" class="small">block_scale: SFA/SFB from TMEM</text>
  <text x="732" y="528" class="tiny">completion: tcgen05.commit + mbarrier</text>

  <rect x="1028" y="398" width="190" height="118" class="box green"/>
  <text x="1082" y="433" class="label">Epilogue</text>
  <text x="1058" y="461" class="small">tcgen05.ld D</text>
  <text x="1058" y="483" class="small">register ops</text>
  <text x="1058" y="505" class="small">store C / output</text>

  <path d="M236 162 H290" class="line"/>
  <path d="M480 162 H535" class="line"/>
  <path d="M765 162 H825" class="line dash"/>
  <text x="774" y="148" class="tiny">desc / cp</text>

  <path d="M212 410 C280 350, 360 337, 456 390" class="line"/>
  <path d="M646 458 H700" class="line"/>
  <path d="M976 458 H1028" class="line"/>
  <path d="M1123 398 C1128 330, 1110 310, 1050 300" class="line dash"/>
  <text x="1124" y="346" class="tiny">read D from TMEM</text>

  <rect x="70" y="590" width="1090" height="72" class="note"/>
  <text x="92" y="618" class="small">同步规则：tcgen05.mma / cp / shift 用 tcgen05.commit + mbarrier 观察完成；tcgen05.ld/st 用 tcgen05.wait::ld/st。</text>
  <text x="92" y="642" class="small">跨线程排序用 tcgen05.fence::before_thread_sync / after_thread_sync；SMEM generic proxy 与 async proxy 共享位置时用 fence.proxy.async。</text>
</svg>
