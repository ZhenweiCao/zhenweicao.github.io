<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#344b5f"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2a33; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #4d5b66; }
      .label { font-size: 18px; font-weight: 700; }
      .small { font-size: 14px; fill: #394956; }
      .tiny { font-size: 12px; fill: #53636f; }
      .box { fill: #f8fafc; stroke: #516273; stroke-width: 1.4; rx: 6; }
      .blue { fill: #e6f0ff; stroke: #3567a8; }
      .green { fill: #e8f5ec; stroke: #3c7b52; }
      .amber { fill: #fff3dc; stroke: #a66c1f; }
      .pink { fill: #fdecef; stroke: #9c3f5d; }
      .purple { fill: #eeeafb; stroke: #6550a8; }
      .line { stroke: #344b5f; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 6 5; }
      .tile { fill: #ffffff; stroke: #83909c; stroke-width: 1; rx: 4; }
      .stolen { fill: #e8f5ec; stroke: #3c7b52; stroke-width: 1.3; rx: 4; }
      .note { fill: #ffffff; stroke: #9aa8b5; stroke-width: 1; rx: 5; }
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>
  <text x="48" y="50" class="title">Blackwell Cluster Launch Control (CLC) Work Stealing</text>
  <text x="48" y="78" class="subtitle">已经运行的 worker 通过 clusterlaunchcontrol.try_cancel 取消尚未启动的 ClcID；成功后用该 tile id 继续工作。</text>

  <rect x="54" y="120" width="300" height="210" class="box blue"/>
  <text x="82" y="154" class="label">Launch Grid: output tiles</text>
  <text x="82" y="181" class="small">每个 ClcID 对应一个 CTA / cluster 工作单元</text>
  <g>
    <rect x="82" y="205" width="54" height="34" class="tile"/><text x="97" y="227" class="tiny">0</text>
    <rect x="144" y="205" width="54" height="34" class="tile"/><text x="159" y="227" class="tiny">1</text>
    <rect x="206" y="205" width="54" height="34" class="tile"/><text x="221" y="227" class="tiny">2</text>
    <rect x="268" y="205" width="54" height="34" class="tile"/><text x="283" y="227" class="tiny">3</text>
    <rect x="82" y="249" width="54" height="34" class="tile"/><text x="97" y="271" class="tiny">4</text>
    <rect x="144" y="249" width="54" height="34" class="stolen"/><text x="159" y="271" class="tiny">5</text>
    <rect x="206" y="249" width="54" height="34" class="tile"/><text x="221" y="271" class="tiny">6</text>
    <rect x="268" y="249" width="54" height="34" class="tile"/><text x="283" y="271" class="tiny">7</text>
  </g>
  <text x="82" y="308" class="tiny">绿色 tile 表示被 worker 成功取消并接管</text>

  <rect x="430" y="116" width="250" height="96" class="box green"/>
  <text x="482" y="151" class="label">Worker / Cluster</text>
  <text x="462" y="178" class="small">先处理自身 blockIdx 对应 tile</text>
  <text x="462" y="199" class="small">常见于 persistent GEMM</text>

  <rect x="430" y="260" width="250" height="124" class="box amber"/>
  <text x="474" y="295" class="label">try_cancel async</text>
  <text x="462" y="323" class="small">单线程提交请求</text>
  <text x="462" y="346" class="small">响应写入 shared result</text>
  <text x="462" y="369" class="small">mbarrier 追踪完成</text>

  <rect x="760" y="210" width="230" height="110" class="box purple"/>
  <text x="816" y="245" class="label">Query Result</text>
  <text x="792" y="273" class="small">success: 返回 canceled ClcID</text>
  <text x="792" y="296" class="small">fail: 没有可取消的工作</text>

  <rect x="1060" y="136" width="170" height="90" class="box green"/>
  <text x="1098" y="171" class="label">Process</text>
  <text x="1087" y="199" class="small">处理 stolen tile</text>

  <rect x="1060" y="320" width="170" height="90" class="box pink"/>
  <text x="1112" y="355" class="label">Exit</text>
  <text x="1080" y="383" class="small">worker 退出或让位</text>

  <path d="M354 224 H430" class="line"/>
  <path d="M555 212 V260" class="line"/>
  <path d="M680 322 H760" class="line"/>
  <path d="M990 255 C1035 238, 1050 204, 1060 181" class="line"/>
  <text x="1010" y="230" class="tiny">success</text>
  <path d="M990 284 C1035 302, 1050 340, 1060 365" class="line"/>
  <text x="1014" y="320" class="tiny">fail</text>
  <path d="M1145 136 C1120 80, 820 82, 642 116" class="line dash"/>
  <text x="852" y="101" class="tiny">循环：继续请求下一个 tile</text>

  <rect x="70" y="505" width="1090" height="108" class="note"/>
  <text x="92" y="534" class="small">CLC 不是 device 端创建新 CTA；它取消的是尚未启动的 CTA / cluster，并把该 ClcID 交给当前 worker。</text>
  <text x="92" y="559" class="small">约束：失败后再提交新请求是未定义行为；cluster 场景下只建议一个 cluster thread 提交，响应 multicast 到各 CTA。</text>
  <text x="92" y="584" class="small">价值：保留 persistent kernel 的低 prologue/epilogue 开销，同时恢复固定 work-per-block 的 load balancing 和 preemption 机会。</text>
</svg>
