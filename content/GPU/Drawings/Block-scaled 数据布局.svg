<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">Block-scaled FP4 数据布局（MXFP4 vs NVFP4）</title>
  <desc id="desc">对比 Blackwell tcgen05.mma block-scaled 模式下的两种 FP4 低精度格式：MXFP4 每 32 个 FP4 元素共享一个 E8M0 缩放因子（OCP 标准），NVFP4 每 16 个 FP4 元素共享一个 FP8 (E4M3) 缩放因子（NVIDIA 自定义）。展示数据布局、缩放因子格式、反量化公式与对比表。</desc>
  <defs>
    <style>
      text {
        font-family: Arial, Helvetica, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
        fill: #0f172a;
      }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #475569; }
      .label { font-size: 17px; font-weight: 700; }
      .small { font-size: 13px; fill: #475569; }
      .tiny { font-size: 11px; fill: #64748b; }
      .mono { font-family: "Menlo", "Consolas", monospace; font-size: 13px; fill: #0f172a; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 1.4; rx: 10; }
      .start { fill: #eef6ff; stroke: #2563eb; stroke-width: 1.8; rx: 10; }
      .metric { fill: #ecfdf5; stroke: #059669; stroke-width: 1.8; rx: 10; }
      .decision { fill: #fefce8; stroke: #ca8a04; stroke-width: 1.8; rx: 10; }
      .fp4 { fill: #e2e8f0; stroke: #475569; stroke-width: 0.8; }
      .e8m0 { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.4; }
      .fp8 { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.4; }
      .tblHead { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1; }
      .tblCell { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
      .bracket { stroke: #475569; stroke-width: 1.2; fill: none; }
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="820" fill="#f8fafc"/>

  <!-- Title -->
  <text x="50" y="50" class="title">Block-scaled FP4 数据布局（MXFP4 vs NVFP4）</text>
  <text x="50" y="76" class="subtitle">Blackwell tcgen05.mma block-scaled 模式；缩放因子格式与 block size 决定数值范围与开销</text>

  <!-- ============ Left column: MXFP4 ============ -->
  <rect x="40" y="105" width="600" height="58" class="start"/>
  <text x="60" y="135" class="label">MXFP4 (OCP 标准)</text>
  <text x="60" y="154" class="small">block size = 32；缩放因子 = E8M0（8-bit 纯指数，仅表示 2^k）</text>

  <!-- MXFP4 data layout: 32 FP4 cells + 1 E8M0 cell -->
  <!-- 32 cells, width 14 each => 448 px wide; start at x=50 -->
  <g>
    <!-- bracket label -->
    <text x="50" y="200" class="small">FP4 × 32（每块 4-bit，E2M1）</text>
    <!-- Row of 32 FP4 squares -->
    <g>
      <!-- We draw 32 small rects manually -->
      <rect x="50"  y="210" width="14" height="24" class="fp4"/>
      <rect x="64"  y="210" width="14" height="24" class="fp4"/>
      <rect x="78"  y="210" width="14" height="24" class="fp4"/>
      <rect x="92"  y="210" width="14" height="24" class="fp4"/>
      <rect x="106" y="210" width="14" height="24" class="fp4"/>
      <rect x="120" y="210" width="14" height="24" class="fp4"/>
      <rect x="134" y="210" width="14" height="24" class="fp4"/>
      <rect x="148" y="210" width="14" height="24" class="fp4"/>
      <rect x="162" y="210" width="14" height="24" class="fp4"/>
      <rect x="176" y="210" width="14" height="24" class="fp4"/>
      <rect x="190" y="210" width="14" height="24" class="fp4"/>
      <rect x="204" y="210" width="14" height="24" class="fp4"/>
      <rect x="218" y="210" width="14" height="24" class="fp4"/>
      <rect x="232" y="210" width="14" height="24" class="fp4"/>
      <rect x="246" y="210" width="14" height="24" class="fp4"/>
      <rect x="260" y="210" width="14" height="24" class="fp4"/>
      <rect x="274" y="210" width="14" height="24" class="fp4"/>
      <rect x="288" y="210" width="14" height="24" class="fp4"/>
      <rect x="302" y="210" width="14" height="24" class="fp4"/>
      <rect x="316" y="210" width="14" height="24" class="fp4"/>
      <rect x="330" y="210" width="14" height="24" class="fp4"/>
      <rect x="344" y="210" width="14" height="24" class="fp4"/>
      <rect x="358" y="210" width="14" height="24" class="fp4"/>
      <rect x="372" y="210" width="14" height="24" class="fp4"/>
      <rect x="386" y="210" width="14" height="24" class="fp4"/>
      <rect x="400" y="210" width="14" height="24" class="fp4"/>
      <rect x="414" y="210" width="14" height="24" class="fp4"/>
      <rect x="428" y="210" width="14" height="24" class="fp4"/>
      <rect x="442" y="210" width="14" height="24" class="fp4"/>
      <rect x="456" y="210" width="14" height="24" class="fp4"/>
      <rect x="470" y="210" width="14" height="24" class="fp4"/>
      <rect x="484" y="210" width="14" height="24" class="fp4"/>
    </g>
    <!-- bracket under FP4 row -->
    <path d="M 50 240 L 50 246 L 498 246 L 498 240" class="bracket"/>
    <text x="220" y="262" class="tiny">32 个 FP4 = 128 bit 数据</text>

    <!-- E8M0 scale block -->
    <rect x="510" y="210" width="36" height="24" class="e8m0"/>
    <text x="528" y="227" class="tiny" text-anchor="middle">E8M0</text>
    <path d="M 510 240 L 510 246 L 546 246 L 546 240" class="bracket"/>
    <text x="528" y="262" class="tiny" text-anchor="middle">scale</text>

    <!-- annotation arrow -->
    <text x="50" y="296" class="small">每 32 个 FP4 共享一个 8-bit 缩放因子</text>
    <text x="50" y="316" class="tiny">元数据开销：8 / (32 × 4) = 8/128 = 6.25% bits（每元素 +0.25 bit）</text>
  </g>

  <!-- MXFP4 element format detail -->
  <rect x="40" y="340" width="600" height="118" class="box"/>
  <text x="60" y="365" class="label">FP4 元素格式（E2M1）</text>
  <text x="60" y="389" class="small">1 sign + 2 exponent + 2 bit 总长 = 4 bit；mantissa 1 bit</text>
  <g>
    <rect x="60"  y="400" width="40" height="26" fill="#fee2e2" stroke="#b91c1c" stroke-width="1"/>
    <text x="80" y="418" class="tiny" text-anchor="middle">S (1)</text>
    <rect x="100" y="400" width="80" height="26" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
    <text x="140" y="418" class="tiny" text-anchor="middle">E (2)</text>
    <rect x="180" y="400" width="40" height="26" fill="#dcfce7" stroke="#15803d" stroke-width="1"/>
    <text x="200" y="418" class="tiny" text-anchor="middle">M (1)</text>
  </g>
  <text x="60" y="446" class="tiny">E8M0 缩放因子：8 bit 全部用作 2 的幂指数（无符号、无尾数），表达范围 2^-127 … 2^127</text>

  <!-- MXFP4 dequant formula -->
  <rect x="40" y="470" width="600" height="74" class="decision"/>
  <text x="60" y="494" class="label">反量化公式</text>
  <text x="60" y="520" class="mono">x_real = ((-1)^s · 2^(e-1) · (1 + m/2)) · 2^scale</text>
  <text x="60" y="538" class="tiny">scale ∈ E8M0：直接是 2 的幂指数（unbiased / biased 由实现定义）</text>

  <!-- ============ Right column: NVFP4 ============ -->
  <rect x="660" y="105" width="580" height="58" class="metric"/>
  <text x="680" y="135" class="label">NVFP4 (NVIDIA 自定义)</text>
  <text x="680" y="154" class="small">block size = 16；缩放因子 = FP8 E4M3（1 sign + 4 exp + 3 mantissa）</text>

  <!-- NVFP4 data layout: 16 FP4 cells + 1 FP8 cell -->
  <g>
    <text x="680" y="200" class="small">FP4 × 16（每块 4-bit，E2M1）</text>
    <g>
      <rect x="680" y="210" width="18" height="24" class="fp4"/>
      <rect x="698" y="210" width="18" height="24" class="fp4"/>
      <rect x="716" y="210" width="18" height="24" class="fp4"/>
      <rect x="734" y="210" width="18" height="24" class="fp4"/>
      <rect x="752" y="210" width="18" height="24" class="fp4"/>
      <rect x="770" y="210" width="18" height="24" class="fp4"/>
      <rect x="788" y="210" width="18" height="24" class="fp4"/>
      <rect x="806" y="210" width="18" height="24" class="fp4"/>
      <rect x="824" y="210" width="18" height="24" class="fp4"/>
      <rect x="842" y="210" width="18" height="24" class="fp4"/>
      <rect x="860" y="210" width="18" height="24" class="fp4"/>
      <rect x="878" y="210" width="18" height="24" class="fp4"/>
      <rect x="896" y="210" width="18" height="24" class="fp4"/>
      <rect x="914" y="210" width="18" height="24" class="fp4"/>
      <rect x="932" y="210" width="18" height="24" class="fp4"/>
      <rect x="950" y="210" width="18" height="24" class="fp4"/>
    </g>
    <path d="M 680 240 L 680 246 L 968 246 L 968 240" class="bracket"/>
    <text x="800" y="262" class="tiny">16 个 FP4 = 64 bit 数据</text>

    <!-- FP8 scale block -->
    <rect x="985" y="210" width="36" height="24" class="fp8"/>
    <text x="1003" y="227" class="tiny" text-anchor="middle">E4M3</text>
    <path d="M 985 240 L 985 246 L 1021 246 L 1021 240" class="bracket"/>
    <text x="1003" y="262" class="tiny" text-anchor="middle">scale</text>

    <text x="680" y="296" class="small">每 16 个 FP4 共享一个 FP8 (E4M3) 缩放因子</text>
    <text x="680" y="316" class="tiny">元数据开销：8 / (16 × 4) = 8/64 = 12.5% bits（每元素 +0.5 bit）</text>
  </g>

  <!-- NVFP4 scale format detail -->
  <rect x="660" y="340" width="580" height="118" class="box"/>
  <text x="680" y="365" class="label">FP8 (E4M3) 缩放因子</text>
  <text x="680" y="389" class="small">1 sign + 4 exponent + 3 mantissa = 8 bit；可表达非 2^k 的细颗粒缩放</text>
  <g>
    <rect x="680" y="400" width="40" height="26" fill="#fee2e2" stroke="#b91c1c" stroke-width="1"/>
    <text x="700" y="418" class="tiny" text-anchor="middle">S (1)</text>
    <rect x="720" y="400" width="160" height="26" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
    <text x="800" y="418" class="tiny" text-anchor="middle">E (4)</text>
    <rect x="880" y="400" width="120" height="26" fill="#dcfce7" stroke="#15803d" stroke-width="1"/>
    <text x="940" y="418" class="tiny" text-anchor="middle">M (3)</text>
  </g>
  <text x="680" y="446" class="tiny">相比 E8M0：尾数携带额外精度，可表示 1.x · 2^k 的连续缩放，对小块的离群值更友好</text>

  <!-- NVFP4 dequant formula -->
  <rect x="660" y="470" width="580" height="74" class="decision"/>
  <text x="680" y="494" class="label">反量化公式</text>
  <text x="680" y="520" class="mono">x_real = ((-1)^s · 2^(e-1) · (1 + m/2)) · scale_fp8</text>
  <text x="680" y="538" class="tiny">scale_fp8 ∈ FP8 E4M3：本身就是一个 FP8 浮点数，按 FP8 解码相乘</text>

  <!-- ============ Bottom comparison table ============ -->
  <g>
    <!-- Header row -->
    <rect x="40"  y="570" width="320" height="34" class="tblHead"/>
    <rect x="360" y="570" width="440" height="34" class="tblHead"/>
    <rect x="800" y="570" width="440" height="34" class="tblHead"/>
    <text x="60"  y="592" class="label">项</text>
    <text x="380" y="592" class="label">MXFP4</text>
    <text x="820" y="592" class="label">NVFP4</text>

    <!-- Row 1: block size -->
    <rect x="40"  y="604" width="320" height="30" class="tblCell"/>
    <rect x="360" y="604" width="440" height="30" class="tblCell"/>
    <rect x="800" y="604" width="440" height="30" class="tblCell"/>
    <text x="60"  y="624" class="small">块大小</text>
    <text x="380" y="624" class="small">32</text>
    <text x="820" y="624" class="small">16</text>

    <!-- Row 2: scale format -->
    <rect x="40"  y="634" width="320" height="30" class="tblCell"/>
    <rect x="360" y="634" width="440" height="30" class="tblCell"/>
    <rect x="800" y="634" width="440" height="30" class="tblCell"/>
    <text x="60"  y="654" class="small">缩放因子格式</text>
    <text x="380" y="654" class="small">E8M0（8 bit，仅 2 的幂）</text>
    <text x="820" y="654" class="small">FP8 E4M3（8 bit，1+4+3）</text>

    <!-- Row 3: precision -->
    <rect x="40"  y="664" width="320" height="30" class="tblCell"/>
    <rect x="360" y="664" width="440" height="30" class="tblCell"/>
    <rect x="800" y="664" width="440" height="30" class="tblCell"/>
    <text x="60"  y="684" class="small">精度</text>
    <text x="380" y="684" class="small">较低（仅能表 2^k 缩放）</text>
    <text x="820" y="684" class="small">较高（可表 1.x · 2^k 连续缩放）</text>

    <!-- Row 4: overhead -->
    <rect x="40"  y="694" width="320" height="30" class="tblCell"/>
    <rect x="360" y="694" width="440" height="30" class="tblCell"/>
    <rect x="800" y="694" width="440" height="30" class="tblCell"/>
    <text x="60"  y="714" class="small">元数据开销</text>
    <text x="380" y="714" class="small">8 / (32×4) = 6.25% bits（+0.25 bit/元素）</text>
    <text x="820" y="714" class="small">8 / (16×4) = 12.5% bits（+0.5 bit/元素）</text>

    <!-- Row 5: source -->
    <rect x="40"  y="724" width="320" height="30" class="tblCell"/>
    <rect x="360" y="724" width="440" height="30" class="tblCell"/>
    <rect x="800" y="724" width="440" height="30" class="tblCell"/>
    <text x="60"  y="744" class="small">来源</text>
    <text x="380" y="744" class="small">OCP 微缩放（MX）标准</text>
    <text x="820" y="744" class="small">NVIDIA Blackwell 自定义</text>
  </g>

  <!-- Bottom callout -->
  <rect x="40" y="768" width="1200" height="38" class="decision"/>
  <text x="60" y="792" class="small">⚠️ 缩放因子绝不是 FP16；常见误区是写成 FP16 缩放。MXFP4 用 E8M0（仅指数），NVFP4 用 FP8 (E4M3)。</text>
</svg>
